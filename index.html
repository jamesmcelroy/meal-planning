<!DOCTYPE html>
<html lang="en" class="locked">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Family Dinners</title>
<meta name="description" content="Rate recipes and vote on next week's dinners.">

<!-- iOS Home Screen / PWA support -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dinners">
<meta name="theme-color" content="#f2f2f7">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<style>
  /*
    Styled from the "iOS Native" design system — Apple HIG tokens for
    color (light/dark), SF Pro type scale, 8pt spacing grid, squircle
    radii, and restrained shadows. See design-system tokens.json for the
    source values and contrast notes.
  */
  :root{
    --label:#000000; --label-secondary:#8a8a8e; --label-tertiary:#c4c4c6;
    --surface-primary:#ffffff; --surface-secondary:#f2f2f7; --surface-tertiary:#ffffff; --surface-grouped:#f2f2f7;
    --separator:#c6c6c8; --separator-opaque:#c6c6c8; --fill-quaternary:#f2f2f7;
    --gray:#8e8e93; --gray-2:#aeaeb2; --gray-3:#c7c7cc; --gray-4:#d1d1d6; --gray-5:#e5e5ea; --gray-6:#f2f2f7;
    --accent-blue:#007aff; --accent-red:#ff3b30; --accent-green:#34c759; --accent-orange:#ff9500;
    --accent-yellow:#ffcc00; --accent-mint:#00c7be; --accent-teal:#30b0c7; --accent-cyan:#32ade6;
    --accent-indigo:#5856d6; --accent-purple:#af52de; --accent-pink:#ff2d55; --accent-brown:#a2845e;
    --shadow-raised:0px 2px 12px rgba(0,0,0,0.12); --shadow-modal:0px 8px 30px rgba(0,0,0,0.2);
    --font-display:-apple-system,'SF Pro Display',system-ui,sans-serif;
    --font-text:-apple-system,'SF Pro Text',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --label:#ffffff; --label-secondary:#8d8d93; --label-tertiary:#47474a;
      --surface-primary:#000000; --surface-secondary:#1c1c1e; --surface-tertiary:#2c2c2e; --surface-grouped:#000000;
      --separator:#323235; --separator-opaque:#38383a; --fill-quaternary:#1c1c1e;
      --gray:#8e8e93; --gray-2:#636366; --gray-3:#48484a; --gray-4:#3a3a3c; --gray-5:#2c2c2e; --gray-6:#1c1c1e;
      --accent-blue:#0a84ff; --accent-red:#ff453a; --accent-green:#30d158; --accent-orange:#ff9f0a;
      --accent-yellow:#ffd60a; --accent-mint:#63e6e2; --accent-teal:#40cbe0; --accent-cyan:#64d2ff;
      --accent-indigo:#5e5ce6; --accent-purple:#bf5af2; --accent-pink:#ff375f; --accent-brown:#ac8e68;
      --shadow-raised:0px 2px 12px rgba(0,0,0,0.4); --shadow-modal:0px 8px 30px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --label:#ffffff; --label-secondary:#8d8d93; --label-tertiary:#47474a;
    --surface-primary:#000000; --surface-secondary:#1c1c1e; --surface-tertiary:#2c2c2e; --surface-grouped:#000000;
    --separator:#323235; --separator-opaque:#38383a; --fill-quaternary:#1c1c1e;
    --gray:#8e8e93; --gray-2:#636366; --gray-3:#48484a; --gray-4:#3a3a3c; --gray-5:#2c2c2e; --gray-6:#1c1c1e;
    --accent-blue:#0a84ff; --accent-red:#ff453a; --accent-green:#30d158; --accent-orange:#ff9f0a;
    --accent-yellow:#ffd60a; --accent-mint:#63e6e2; --accent-teal:#40cbe0; --accent-cyan:#64d2ff;
    --accent-indigo:#5e5ce6; --accent-purple:#bf5af2; --accent-pink:#ff375f; --accent-brown:#ac8e68;
    --shadow-raised:0px 2px 12px rgba(0,0,0,0.4); --shadow-modal:0px 8px 30px rgba(0,0,0,0.55);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--surface-grouped);color:var(--label);font-family:var(--font-text);font-weight:400;
    -webkit-font-smoothing:antialiased;
    font-size:17px;line-height:22px;letter-spacing:-0.43px; /* body */
    min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{font-family:var(--font-display)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit}

  /* ---------- App shell ---------- */
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header.top{
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background:color-mix(in srgb, var(--surface-secondary) 92%, transparent);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:0.5px solid var(--separator);
    color:var(--label);
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;
  }
  header.top h1{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-0.43px;color:var(--label)} /* headline */
  header.top .who{font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);display:flex;align-items:center;gap:8px} /* footnote */
  header.top .who button{color:var(--accent-blue);font-size:13px;font-weight:400}
  main{flex:1;padding:16px 16px 100px}

  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;
    background:color-mix(in srgb, var(--surface-secondary) 92%, transparent);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:0.5px solid var(--separator);
    display:flex;max-width:640px;margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom);
    z-index:10;
  }
  nav.tabs button{
    flex:1;padding:6px 4px;min-height:44px;font-size:11px;line-height:13px;letter-spacing:0.06px;color:var(--gray);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  } /* caption-2 */
  nav.tabs button .ic{font-size:22px;line-height:1;filter:grayscale(1);opacity:0.7}
  nav.tabs button.active{color:var(--accent-blue);font-weight:600}
  nav.tabs button.active .ic{filter:none;opacity:1}

  /* ---------- Name picker (onboarding) ---------- */
  #namePicker{
    position:fixed;inset:0;background:var(--surface-grouped);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  }
  #namePicker h2{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-0.36px;margin-bottom:6px;text-align:center;color:var(--label)} /* title-1 */
  #namePicker p{font-size:15px;line-height:20px;letter-spacing:-0.24px;color:var(--label-secondary);margin-bottom:32px;text-align:center} /* subheadline */
  .name-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}
  .name-btn{
    padding:14px 16px;min-height:44px;border-radius:14px;background:var(--surface-tertiary);
    font-size:17px;line-height:22px;letter-spacing:-0.43px;font-weight:600;color:var(--label);
    text-align:left;
  } /* headline, radius-lg */
  .name-btn:active{background:var(--fill-quaternary)}

  /* ---------- Password gate ---------- */
  /* Light deterrent only, not real security -- see comment on #passwordGate
     below and the script that drives it, near the top of <body>. */
  html.locked #namePicker,html.locked #app{display:none}
  #passwordGate{
    position:fixed;inset:0;background:var(--surface-grouped);z-index:200;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  }
  #passwordGate.hidden{display:none}
  #passwordGate h2{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-0.36px;margin-bottom:6px;text-align:center;color:var(--label)}
  #passwordGate p{font-size:15px;line-height:20px;letter-spacing:-0.24px;color:var(--label-secondary);margin-bottom:24px;text-align:center}
  #gateForm{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
  #gatePassword{
    padding:14px 16px;min-height:44px;border-radius:14px;background:var(--surface-tertiary);
    font-size:17px;color:var(--label);border:1px solid var(--separator);
  }
  #gateSubmit{
    padding:14px 16px;min-height:44px;border-radius:14px;background:var(--accent-blue);
    font-size:17px;font-weight:600;color:#ffffff;text-align:center;
  }
  #gateSubmit:active{opacity:0.8}
  #gateError{color:var(--accent-red);font-size:14px;min-height:18px;text-align:center}

  /* ---------- Recipe origin chip (New = weekly search find, Existing =
     already in the family's AnyList collection, cooked or not) ---------- */
  .origin-chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;padding:3px 8px;border-radius:9999px;margin-left:8px;vertical-align:middle}
  .chip-new{background:var(--accent-green);color:#ffffff}
  .chip-existing{background:var(--fill-quaternary);color:var(--label-secondary)}

  /* ---------- Cards ---------- */
  .card{
    background:var(--surface-tertiary);border-radius:14px;padding:16px;margin-bottom:12px;
  } /* radius-lg, shadow-none by default per HIG deference */
  .card h3{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-0.24px;color:var(--label);margin-bottom:2px} /* title-3 */
  .card .desc{font-size:15px;line-height:20px;letter-spacing:-0.24px;color:var(--label-secondary);margin-bottom:10px} /* subheadline */
  .card .meta-row{display:flex;gap:12px;font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);margin-bottom:12px} /* footnote */
  .stars-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .stars{display:flex;gap:4px}
  .stars button{font-size:24px;line-height:1;color:var(--gray-4);min-width:32px;min-height:32px}
  .stars button.filled{color:var(--accent-orange)}
  .scale-toggle{
    font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--accent-blue);
    white-space:nowrap;
  } /* footnote, accent-blue is safe for body-size text per HIG */
  .scale-legend{
    font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label);background:var(--surface-secondary);border-radius:10px;padding:10px 12px;
    margin-bottom:10px;
  } /* footnote, radius-md */
  .scale-legend div{display:flex;gap:6px;padding:2px 0}
  .scale-legend b{color:var(--label-secondary);min-width:16px;font-weight:600}
  .avg-row{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--label-secondary);margin-bottom:10px}
  .avg-row .n{color:var(--label-tertiary)}
  .per-person{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:13px;line-height:18px;letter-spacing:-0.08px;background:var(--fill-quaternary);border-radius:9999px;padding:4px 10px;color:var(--label-secondary)} /* footnote, radius-full */
  .chip strong{color:var(--label);font-weight:600}
  textarea.comment{
    width:100%;border:none;border-radius:10px;padding:10px 12px;font-size:15px;line-height:20px;letter-spacing:-0.24px;
    min-height:56px;resize:vertical;background:var(--surface-secondary);color:var(--label);
  } /* subheadline, radius-md */
  textarea.comment::placeholder{color:var(--label-tertiary)}
  .comment-list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .comment-item{font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);background:var(--surface-secondary);border-radius:10px;padding:8px 10px}
  .comment-item b{color:var(--label);font-weight:600}
  .save-hint{font-size:11px;line-height:13px;letter-spacing:0.06px;color:var(--label-tertiary);margin-top:6px;height:14px} /* caption-2 */

  /* ---------- Vote view ---------- */
  .vote-card{display:flex;align-items:center;gap:14px}
  .vote-card .info{flex:1}
  .vote-count{
    display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;
  }
  .vote-count .num{font-family:var(--font-display);font-size:20px;line-height:25px;font-weight:700;color:var(--label)} /* title-3 */
  .vote-btn{
    width:44px;height:44px;border-radius:9999px;background:var(--fill-quaternary);font-size:20px;color:var(--accent-blue);
  } /* radius-full, min tap target */
  .vote-btn.voted{background:var(--accent-blue);color:#ffffff}
  .section-label{font-size:13px;line-height:18px;letter-spacing:-0.08px;text-transform:uppercase;color:var(--label-secondary);margin:24px 0 8px;padding:0 4px} /* footnote, space-6 */
  .section-label:first-child{margin-top:0}
  .empty{color:var(--label-secondary);text-align:center;padding:40px 20px;font-size:15px;line-height:20px}
  .banner-info{background:var(--surface-secondary);border-radius:10px;padding:12px 14px;font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);margin-bottom:16px} /* footnote, radius-md, no colored border per HIG deference */

  /* ---------- Tonight view ---------- */
  .tonight-card{
    background:var(--label);color:var(--surface-primary);border-radius:20px;padding:20px 18px;margin-bottom:16px;
  } /* radius-xl for the featured presented surface */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tonight-card{background:var(--surface-tertiary);color:var(--label)}
  }
  :root[data-theme="dark"] .tonight-card{background:var(--surface-tertiary);color:var(--label)}
  .tonight-card .label{font-size:13px;line-height:18px;letter-spacing:-0.08px;text-transform:uppercase;color:var(--accent-orange);margin-bottom:6px;opacity:0.9}
  .tonight-card h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-0.26px;margin-bottom:4px} /* title-2 */
  .tonight-card .desc{font-size:15px;line-height:20px;letter-spacing:-0.24px;opacity:0.7;margin-bottom:14px}
  .tonight-card .stars button{color:rgba(255,255,255,0.3)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tonight-card .stars button{color:var(--gray-4)} }
  :root[data-theme="dark"] .tonight-card .stars button{color:var(--gray-4)}
  .tonight-card .stars button.filled{color:var(--accent-orange) !important}
  .tonight-card .scale-toggle{color:var(--accent-cyan)}
  .tonight-card .scale-legend{background:rgba(255,255,255,0.08);color:inherit}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tonight-card .scale-legend{background:var(--surface-secondary)} }
  :root[data-theme="dark"] .tonight-card .scale-legend{background:var(--surface-secondary)}
  .tonight-card .scale-legend b{color:rgba(255,255,255,0.6)}
  .tonight-card textarea.comment{background:rgba(255,255,255,0.1);color:inherit}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tonight-card textarea.comment{background:var(--surface-secondary)} }
  :root[data-theme="dark"] .tonight-card textarea.comment{background:var(--surface-secondary)}
  .tonight-card textarea.comment::placeholder{color:rgba(255,255,255,0.4)}
  .tonight-card .save-hint{color:rgba(255,255,255,0.5)}
  .tonight-card .per-person{margin-top:14px}
  .tonight-card .chip{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tonight-card .chip{background:var(--fill-quaternary);color:var(--label-secondary)} }
  :root[data-theme="dark"] .tonight-card .chip{background:var(--fill-quaternary);color:var(--label-secondary)}
  .tonight-card .chip strong{color:#ffffff}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tonight-card .chip strong{color:var(--label)} }
  :root[data-theme="dark"] .tonight-card .chip strong{color:var(--label)}
  .tonight-card .comment-item{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.75)}
  .tonight-card .comment-item b{color:#ffffff}

  .set-menu{
    background:var(--surface-tertiary);border-radius:14px;padding:14px 16px;margin-bottom:16px;
  } /* radius-lg */
  .set-menu .label{font-size:13px;line-height:18px;letter-spacing:-0.08px;text-transform:uppercase;color:var(--label-secondary);margin-bottom:10px}
  .set-menu select{
    width:100%;padding:12px;min-height:44px;border:none;border-radius:10px;background:var(--surface-secondary);color:var(--label);
    font-size:17px;line-height:22px;letter-spacing:-0.43px;font-family:inherit;
  } /* radius-md, body */

  /* ---------- This week (rolling 7-day planner on Home) ---------- */
  .week-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 0;border-bottom:0.5px solid var(--separator);
  }
  .week-item:last-child{border-bottom:none}
  .week-item .wdate{font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);min-width:78px}
  .week-item .wdate.today{color:var(--accent-blue);font-weight:700}
  .week-item .wname{font-size:15px;line-height:20px;letter-spacing:-0.24px;color:var(--label);flex:1;text-align:right}
  .week-item .wname.unset{color:var(--label-tertiary);font-style:italic}
  .week-item select{
    max-width:180px;padding:0 28px 0 12px;height:36px;border:none;border-radius:9999px;background:var(--fill-quaternary);color:var(--label);
    font-size:14px;font-weight:600;letter-spacing:-0.15px;font-family:inherit;-webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238a8a8e' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center;
  }

  /* ---------- Choose view (search + shared queue) ---------- */
  .search-box{
    width:100%;padding:12px 14px;min-height:44px;border:none;border-radius:10px;background:var(--surface-tertiary);color:var(--label);
    font-size:17px;line-height:22px;letter-spacing:-0.43px;font-family:inherit;margin-bottom:16px;
  } /* radius-md, body */
  .search-box::placeholder{color:var(--label-tertiary)}
  .queue-card{display:flex;align-items:center;gap:14px}
  .queue-card .info{flex:1}
  .queue-card .added-by{font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);margin-top:2px}
  .queue-btn{
    min-width:44px;height:44px;padding:0 14px;border-radius:9999px;background:var(--fill-quaternary);
    font-size:15px;font-weight:600;letter-spacing:-0.24px;color:var(--accent-blue);white-space:nowrap;
  } /* radius-full, min tap target */
  .queue-btn.queued{background:var(--accent-blue);color:#ffffff}
.candidate-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.candidate-remove-btn{min-width:44px;height:32px;padding:0 12px;border-radius:9999px;background:none;font-size:13px;font-weight:600;letter-spacing:-0.08px;color:var(--label-tertiary);white-space:nowrap}
.removed-toggle{font-size:14px;font-weight:600;color:var(--accent-blue);padding:12px 0;cursor:pointer}
.removed-card{opacity:0.6}
  .filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .filter-select{
    -webkit-appearance:none;appearance:none;
    padding:0 30px 0 14px;height:36px;border:none;border-radius:9999px;background:var(--fill-quaternary);color:var(--label-secondary);
    font-size:14px;font-weight:600;letter-spacing:-0.15px;font-family:inherit;white-space:nowrap;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238a8a8e' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;
  } /* radius-full, native <select> renders iOS's picker wheel */
  .filter-select.active{background-color:var(--accent-blue);color:#ffffff}
  .filter-select.active{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='white' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>")}
  .filter-clear{font-size:14px;font-weight:600;color:var(--accent-blue);padding:0 4px;height:36px;display:inline-flex;align-items:center}
  .history-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 0;border-bottom:0.5px solid var(--separator);
  }
  .history-item:last-child{border-bottom:none}
  .history-item .hdate{font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);min-width:64px}
  .history-item .hname{font-size:15px;line-height:20px;letter-spacing:-0.24px;color:var(--label);flex:1}
  .history-item .hstars{font-size:13px;color:var(--accent-orange);white-space:nowrap;font-weight:600}
  .history-item .hstars .none{color:var(--label-tertiary);font-style:normal;font-size:13px;font-weight:400}
</style>
</head>
<body>

<div id="passwordGate">
  <h2>Family Dinners</h2>
  <p>Enter the family password to continue.</p>
  <form id="gateForm" autocomplete="on">
    <input type="password" id="gatePassword" name="password" autocomplete="current-password" placeholder="Password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="submit" id="gateSubmit">Unlock</button>
    <div id="gateError"></div>
  </form>
</div>

<script>
// Simple front-door deterrent, not real security: this only hides the page
// behind a shared password so a stranger who stumbles on the URL can't see
// it at a glance. It does NOT protect the underlying Firestore data, which
// stays reachable by anyone who knows the project ID regardless of this
// gate -- GitHub Pages has no server to enforce that, only the browser.
// The password itself isn't stored here, only its SHA-256 hash, so it's not
// sitting in plain text in the page source.
(function(){
  var STORAGE_KEY = "mealAppUnlocked";
  var PASSWORD_HASH = "7057709fcc2a486d031dd7767dea2da7bf609b749f4e1e015993eead3f0597c6";
  var gate = document.getElementById("passwordGate");
  var form = document.getElementById("gateForm");
  var input = document.getElementById("gatePassword");
  var error = document.getElementById("gateError");

  function reveal(){
    document.documentElement.classList.remove("locked");
    gate.classList.add("hidden");
  }
  function unlock(){
    try { localStorage.setItem(STORAGE_KEY, "yes"); } catch(e) {}
    reveal();
  }
  try {
    if (localStorage.getItem(STORAGE_KEY) === "yes") reveal();
  } catch(e) {}

  async function sha256Hex(text){
    var data = new TextEncoder().encode(text);
    var hashBuffer = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hashBuffer)).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    error.textContent = "";
    var hash = await sha256Hex(input.value);
    if (hash === PASSWORD_HASH) {
      unlock();
    } else {
      error.textContent = "That's not it \u2014 try again.";
      input.value = "";
      input.focus();
    }
  });
})();
</script>

<script type="module">
const FAMILY_MEMBERS = ["James", "Roisin", "Colbie", "Bryce", "Gage"];
const MENU_OWNER = "James"; // only this person can set what's cooking each night

// Firebase is loaded dynamically and lazily so that a network hiccup or a
// blocked CDN doesn't take down the whole app — the name picker, recipe
// browsing, and navigation all work even if Firebase never connects. Only
// live sync of ratings/votes depends on it.
let db = null;
let fb = null; // holds { doc, setDoc, onSnapshot, collection }
let firebaseStatus = "connecting"; // "connecting" | "connected" | "unavailable"

async function initFirebase() {
  try {
    const [{ initializeApp }, firestoreMod, { firebaseConfig }] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"),
      import("./firebase-config.js")
    ]);
    if (firebaseConfig.apiKey === "YOUR_API_KEY") {
      console.warn("firebase-config.js still has placeholder values — see SETUP.md");
      firebaseStatus = "unavailable";
      render();
      return;
    }
    const fbApp = initializeApp(firebaseConfig);
    db = firestoreMod.getFirestore(fbApp);
    fb = firestoreMod;
    firebaseStatus = "connected";
    listenToRatings();
    listenToVotes();
    listenToMenu();
    listenToQueue();
    listenToOverrides();
    render();
  } catch (e) {
    console.error("Firebase failed to load — app will run in read-only/offline mode.", e);
    firebaseStatus = "unavailable";
    render();
  }
}

// ---------- State ----------
let currentUser = localStorage.getItem("familyDinners.user") || null;
let recipesIndex = [];       // from recipes.json
let recipeDetails = {};      // file -> parsed recipe object
let ratings = {};            // recipeId -> { personName: {stars, comment} }
let votes = {};              // weekKey -> { recipeId: [personNames] }
let menu = {};                // dateKey (YYYY-MM-DD, Eastern) -> { recipeId, setBy, setAt }
let queue = {};               // recipeId -> { addedBy, addedAt } — shared "up next" shortlist, anyone can add/remove
let overrides = {};           // recipeId -> { removed, removedBy, removedAt } — candidate dismissals, anyone can toggle
let activeView = "tonight";
let searchQuery = "";
let activeCategoryFilter = null;   // e.g. "chicken", "beef", "seafood", "pork", "sausage", "vegetarian"
let activeTempFilter = null;       // "hot" | "cold"
let activeTagFilter = null;        // e.g. "quick", "slow-cooker", "one-pan", "salad", "soup", "pasta", "grill", "casserole"
let activeStatusFilter = null;     // Recipes tab only: "active" | "candidate" | "unproven" -- never affects Choose
let activeSortBy = "rating";       // Recipes tab only: "rating" | "name" | "quickest"
// Recipes tab resort debouncing -- ratings sync live from every family
// member's device, and resorting the instant one comes in (while someone's
// mid-scroll) feels jarring. A direct filter/sort/status change still
// applies immediately; only a reorder caused by live data settles after a
// quiet period. See renderRecipesView.
let recipesDisplayOrder = [];      // file names, in the order currently on screen
let recipesSortSignature = null;   // filters+sort combo that produced recipesDisplayOrder
let recipesResortTimer = null;     // pending debounce timer, or null
let recipesPendingTarget = null;   // the "file|file|..." order the pending timer will apply
const RECIPES_RESORT_DEBOUNCE_MS = 1500;
let showRemovedCandidates = false; // New tab: whether the "Removed" section is expanded
let voteExtraShown = {};       // Vote tab: category -> total recipes currently shown (defaults to 5 when unset); grows by 5 each "Show 5 more" click (session-only, not saved)
const expandedScaleLegends = new Set(); // recipeIds currently showing the "what do stars mean" legend

const CURRENT_WEEK = getWeekKey();
const TODAY_KEY = getDateKey();

function getWeekKey(d = new Date()) {
  // ISO-ish week key: YYYY-Www, using US Eastern-style Monday start.
  const date = new Date(d);
  date.setHours(0,0,0,0);
  const day = date.getDay() || 7;
  date.setDate(date.getDate() + 1 - day);
  const yearStart = new Date(date.getFullYear(),0,1);
  const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return `${date.getFullYear()}-W${String(weekNo).padStart(2,"0")}`;
}

function getDateKey(d = new Date()) {
  // YYYY-MM-DD in US Eastern time, so "tonight" means the same thing for
  // everyone in the family regardless of the device's local timezone.
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"
  }).formatToParts(d).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
  return `${parts.year}-${parts.month}-${parts.day}`;
}

function formatDateKey(key) {
  // "2026-09-27" -> "Sun, Sep 27"
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(Date.UTC(y, m - 1, d, 12));
  return new Intl.DateTimeFormat("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" }).format(date);
}

function dateKeyPlusDays(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return getDateKey(d);
}

function upcomingWeekKeys() {
  // Today (TODAY_KEY) through the next 6 days -- the rolling 7-day
  // planning window shown on the Home tab and used for day-assignment
  // in Choose.
  return Array.from({ length: 7 }, (_, i) => dateKeyPlusDays(i));
}

function friendlyDateLabel(key) {
  if (key === TODAY_KEY) return "Today";
  if (key === dateKeyPlusDays(1)) return "Tomorrow";
  return formatDateKey(key);
}

function dayAssignSelectHtml(recipeId) {
  // Lets James schedule a recipe directly onto one of the next 7 days from
  // Choose (or from the shared Up Next list), instead of only queuing it
  // and setting the day later from Home. Resets to the placeholder after
  // each use -- it's a one-shot action, not a persistent field.
  const options = upcomingWeekKeys().map(key => {
    const existingId = menu[key]?.recipeId || null;
    let suffix = "";
    if (existingId && existingId !== recipeId) {
      const existingEntry = recipesIndex.find(r => recipeIdFromFile(r.file) === existingId);
      const existingRecipe = existingEntry ? recipeDetails[existingEntry.file] : null;
      if (existingRecipe) suffix = ` (replace ${existingRecipe.name})`;
    } else if (existingId === recipeId) {
      suffix = " (already set)";
    }
    return `<option value="${key}">${escapeHtml(friendlyDateLabel(key) + suffix)}</option>`;
  }).join("");
  return `<select class="filter-select" data-day-assign="${recipeId}"><option value="">Assign to a day…</option>${options}</select>`;
}

function moveMealSelectHtml(fromKey, recipeId) {
  // Lets James reschedule a night that's already planned to a different day
  // in the rolling 7-day window, without picking a brand-new recipe --
  // assigning a new recipe to a day happens from Choose (dayAssignSelectHtml)
  // instead. Resets to the placeholder after each use, same reasoning.
  const options = upcomingWeekKeys().filter(key => key !== fromKey).map(key => {
    const existingId = menu[key]?.recipeId || null;
    let suffix = "";
    if (existingId && existingId !== recipeId) {
      const existingEntry = recipesIndex.find(r => recipeIdFromFile(r.file) === existingId);
      const existingRecipe = existingEntry ? recipeDetails[existingEntry.file] : null;
      if (existingRecipe) suffix = ` (replace ${existingRecipe.name})`;
    }
    return `<option value="${key}">${escapeHtml(friendlyDateLabel(key) + suffix)}</option>`;
  }).join("");
  return `<select data-move-meal="${fromKey}"><option value="">Move to…</option>${options}</select>`;
}

function recipeIdFromFile(file) {
  return file.replace(/\.html$/, "");
}

// ---------- Load recipes.json + parse each recipe's JSON-LD ----------
async function loadRecipes() {
  const res = await fetch("recipes.json", {cache: "no-store"});
  const data = await res.json();
  recipesIndex = data.recipes.filter(r => r.status !== "retired");

  await Promise.all(recipesIndex.map(async (entry) => {
    try {
      const html = await (await fetch(entry.file, {cache: "no-store"})).text();
      const match = html.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/);
      if (match) {
        const json = JSON.parse(match[1]);
        recipeDetails[entry.file] = json;
      }
    } catch (e) {
      console.error("Failed to load recipe", entry.file, e);
    }
  }));
}

// ---------- Firestore live sync ----------
function listenToRatings() {
  if (!db) return;
  fb.onSnapshot(fb.collection(db, "ratings"), (snap) => {
    ratings = {};
    snap.forEach(docSnap => {
      ratings[docSnap.id] = docSnap.data().people || {};
    });
    // Exposed read-only for the weekly scheduled task, which checks this
    // from a browser to auto-promote rated candidates — not used by the
    // app's own UI, and independent of currentUser so it updates even
    // before anyone picks a name.
    window.__ratings = ratings;
    render();
  }, (err) => console.error("ratings listener error", err));
}

function listenToVotes() {
  if (!db) return;
  fb.onSnapshot(fb.collection(db, "votes"), (snap) => {
    votes = {};
    snap.forEach(docSnap => {
      votes[docSnap.id] = docSnap.data();
    });
    render();
  }, (err) => console.error("votes listener error", err));
}

function listenToMenu() {
  if (!db) return;
  fb.onSnapshot(fb.collection(db, "menu"), (snap) => {
    menu = {};
    snap.forEach(docSnap => {
      menu[docSnap.id] = docSnap.data();
    });
    render();
  }, (err) => console.error("menu listener error", err));
}

function listenToQueue() {
  if (!db) return;
  // The shared queue lives in a single doc (queue/shared) since it's an
  // unordered shortlist, not scoped to a week like votes.
  fb.onSnapshot(fb.doc(db, "queue", "shared"), (docSnap) => {
    queue = docSnap.exists() ? (docSnap.data() || {}) : {};
    render();
  }, (err) => console.error("queue listener error", err));
}

function listenToOverrides() {
  if (!db) return;
  // Per-recipe overrides (currently just "removed") keyed like ratings, so
  // dismissing a candidate from the New tab is instant and shared by the
  // whole family without needing a new recipes.json push.
  fb.onSnapshot(fb.collection(db, "recipeOverrides"), (snap) => {
    overrides = {};
    snap.forEach(docSnap => {
      overrides[docSnap.id] = docSnap.data();
    });
    // Exposed read-only for the weekly scheduled task — see note in
    // listenToRatings above.
    window.__overrides = overrides;
    render();
  }, (err) => console.error("overrides listener error", err));
}

async function setRating(recipeId, stars, comment) {
  if (!currentUser) return;
  if (!db) { alert("Not connected — ratings can't be saved right now. Check your internet connection."); return; }
  const ref = fb.doc(db, "ratings", recipeId);
  const existing = ratings[recipeId] || {};
  const updated = {
    ...existing,
    [currentUser]: {
      stars: stars ?? (existing[currentUser]?.stars ?? null),
      comment: comment !== undefined ? comment : (existing[currentUser]?.comment ?? ""),
      updatedAt: new Date().toISOString()
    }
  };
  await fb.setDoc(ref, { people: updated }, { merge: true });
}

async function toggleVote(recipeId) {
  if (!currentUser) return;
  if (!db) { alert("Not connected — votes can't be saved right now. Check your internet connection."); return; }
  const ref = fb.doc(db, "votes", CURRENT_WEEK);
  const weekVotes = votes[CURRENT_WEEK] || {};
  const current = weekVotes[recipeId] || [];
  const already = current.includes(currentUser);
  const updated = already
    ? current.filter(n => n !== currentUser)
    : [...current, currentUser];
  await fb.setDoc(ref, { [recipeId]: updated }, { merge: true });
}

async function setTonightRecipe(dateKey, recipeId) {
  if (!currentUser) return;
  if (currentUser !== MENU_OWNER) return; // only MENU_OWNER can set what's cooking each night
  if (!db) { alert("Not connected — the menu can't be saved right now. Check your internet connection."); return; }
  const ref = fb.doc(db, "menu", dateKey);
  if (!recipeId) {
    await fb.setDoc(ref, { recipeId: null, setBy: currentUser, setAt: new Date().toISOString() }, { merge: true });
    return;
  }
  await fb.setDoc(ref, { recipeId, setBy: currentUser, setAt: new Date().toISOString() }, { merge: true });
}

async function toggleQueue(recipeId) {
  if (!currentUser) return;
  if (!db) { alert("Not connected — the list can't be saved right now. Check your internet connection."); return; }
  const ref = fb.doc(db, "queue", "shared");
  if (queue[recipeId]) {
    // Anyone can remove any entry — it's a shared shortlist, not a personal one.
    const updated = { ...queue };
    delete updated[recipeId];
    await fb.setDoc(ref, updated);
  } else {
    await fb.setDoc(ref, {
      [recipeId]: { addedBy: currentUser, addedAt: new Date().toISOString() }
    }, { merge: true });
  }
}

async function setRemoved(recipeId, removed) {
  if (!currentUser) return;
  if (!db) { alert("Not connected — this can't be saved right now. Check your internet connection."); return; }
  const ref = fb.doc(db, "recipeOverrides", recipeId);
  await fb.setDoc(ref, {
    removed,
    removedBy: currentUser,
    removedAt: new Date().toISOString()
  }, { merge: true });
}

// ---------- Rendering ----------
function iso8601ToMinutes(iso) {
  if (!iso) return null;
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
  if (!m) return null;
  const h = parseInt(m[1] || "0", 10);
  const min = parseInt(m[2] || "0", 10);
  return h * 60 + min;
}

function avgStars(recipeId) {
  const people = ratings[recipeId] || {};
  const vals = Object.values(people).map(p => p.stars).filter(v => typeof v === "number");
  if (!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}

function starsHtml(recipeId, interactive) {
  const mine = (ratings[recipeId]?.[currentUser]?.stars) || 0;
  let html = '<div class="stars">';
  for (let i = 1; i <= 5; i++) {
    html += `<button data-star="${i}" data-recipe="${recipeId}" class="${i <= mine ? 'filled' : ''}" ${interactive ? '' : 'disabled'}>★</button>`;
  }
  html += '</div>';
  return html;
}

const RATING_SCALE = [
  ["1", "Didn't work — not worth repeating"],
  ["2", "Edible, but something was off"],
  ["3", "Solid — fine to make again"],
  ["4", "Good — want it in regular rotation"],
  ["5", "Favorite — always excited to see it planned"],
];

function scaleLegendHtml() {
  return RATING_SCALE.map(([n, desc]) => `<div><b>${n}★</b><span>${escapeHtml(desc)}</span></div>`).join("");
}

function ratingWidgetHtml(id, recipe) {
  const people = ratings[id] || {};
  const myComment = people[currentUser]?.comment || "";
  const chips = FAMILY_MEMBERS.map(name => {
    const s = people[name]?.stars;
    return `<span class="chip">${name}: <strong>${s ? '★'.repeat(s) : '—'}</strong></span>`;
  }).join("");
  const comments = Object.entries(people)
    .filter(([, v]) => v.comment)
    .map(([name, v]) => `<div class="comment-item"><b>${name}:</b> ${escapeHtml(v.comment)}</div>`)
    .join("");
  const expanded = expandedScaleLegends.has(id);
  return `
    <div class="per-person">${chips}</div>
    <div class="stars-row">
      ${starsHtml(id, true)}
      <button class="scale-toggle" data-scale-toggle="${id}">${expanded ? "Hide" : "What do stars mean?"}</button>
    </div>
    ${expanded ? `<div class="scale-legend">${scaleLegendHtml()}</div>` : ""}
    <textarea class="comment" data-recipe="${id}" placeholder="Notes for next time (e.g. 'add more garlic')...">${escapeHtml(myComment)}</textarea>
    <div class="save-hint" data-hint="${id}"></div>
    ${comments ? `<div class="comment-list">${comments}</div>` : ""}
  `;
}

function renderTonightView() {
  const todaysMenu = menu[TODAY_KEY];
  const todaysRecipeId = todaysMenu?.recipeId || null;
  const todaysEntry = todaysRecipeId ? recipesIndex.find(r => recipeIdFromFile(r.file) === todaysRecipeId) : null;
  const todaysRecipe = todaysEntry ? recipeDetails[todaysEntry.file] : null;

  let html = "";

  // ---- This week: rolling 7-day forward plan ----
  // James can set or change any of the 7 days right here, not just
  // tonight's -- the same setTonightRecipe() write either way.
  html += `<div class="section-label">This week</div><div class="card">`;
  html += upcomingWeekKeys().map(key => {
    const dayRecipeId = menu[key]?.recipeId || null;
    const dayEntry = dayRecipeId ? recipesIndex.find(r => recipeIdFromFile(r.file) === dayRecipeId) : null;
    const dayRecipe = dayEntry ? recipeDetails[dayEntry.file] : null;
    const label = friendlyDateLabel(key);
    const isToday = key === TODAY_KEY;

    if (currentUser === MENU_OWNER && dayRecipe) {
      return `
        <div class="week-item">
          <span class="wdate${isToday ? " today" : ""}">${escapeHtml(label)}</span>
          <span class="wname">${escapeHtml(dayRecipe.name)}</span>
          ${moveMealSelectHtml(key, dayRecipeId)}
        </div>`;
    }
    return `
      <div class="week-item">
        <span class="wdate${isToday ? " today" : ""}">${escapeHtml(label)}</span>
        <span class="wname${dayRecipe ? "" : " unset"}">${dayRecipe ? escapeHtml(dayRecipe.name) : "Not set"}</span>
      </div>`;
  }).join("");
  html += `</div>`;

  // ---- Tonight's meal, ready to rate ----
  if (todaysRecipe) {
    const id = todaysRecipeId;
    const mins = iso8601ToMinutes(todaysRecipe.totalTime);
    html += `
      <div class="card tonight-card">
        <div class="label">Tonight</div>
        <h2>${escapeHtml(todaysRecipe.name)}</h2>
        ${todaysRecipe.description ? `<p class="desc">${escapeHtml(todaysRecipe.description)}</p>` : ""}
        ${mins ? `<div class="meta-row" style="color:inherit;opacity:0.7"><span>${mins} min</span></div>` : ""}
        ${ratingWidgetHtml(id, todaysRecipe)}
      </div>
    `;
  } else {
    html += `<div class="empty">No dinner set for tonight yet. Pick one above once you know what's cooking.</div>`;
  }

  // ---- Recent nights, still open for rating ----
  // The last few nights (not counting tonight) each get their own full
  // rating widget, so the family can catch up on rating without having to
  // hunt through the Recipes tab for what was cooked when.
  const RATEABLE_PAST_NIGHTS = 2;
  const allKeys = Object.keys(menu)
    .filter(k => k <= TODAY_KEY && menu[k]?.recipeId)
    .sort((a, b) => b.localeCompare(a));
  const pastKeys = allKeys.filter(k => k !== TODAY_KEY);
  const rateableKeys = pastKeys.slice(0, RATEABLE_PAST_NIGHTS);
  const olderKeys = pastKeys.slice(RATEABLE_PAST_NIGHTS, RATEABLE_PAST_NIGHTS + 8);

  if (rateableKeys.length) {
    html += `<div class="section-label">Rate a recent night</div>`;
    html += rateableKeys.map(key => {
      const entry = menu[key];
      const recipeEntry = recipesIndex.find(r => recipeIdFromFile(r.file) === entry.recipeId);
      const recipe = recipeEntry ? recipeDetails[recipeEntry.file] : null;
      if (!recipe) return "";
      const mins = iso8601ToMinutes(recipe.totalTime);
      return `
        <div class="card">
          <div class="label" style="font-size:13px;letter-spacing:-0.08px;color:var(--label-secondary);text-transform:uppercase;margin-bottom:2px">${formatDateKey(key)}</div>
          <h3>${escapeHtml(recipe.name)}</h3>
          ${mins ? `<div class="meta-row"><span>${mins} min</span></div>` : ""}
          ${ratingWidgetHtml(entry.recipeId, recipe)}
        </div>
      `;
    }).join("");
  }

  // ---- Older history, summary only ----
  if (olderKeys.length) {
    html += `<div class="section-label">Earlier dinners</div><div class="card">`;
    html += olderKeys.map(key => {
      const entry = menu[key];
      const recipeEntry = recipesIndex.find(r => recipeIdFromFile(r.file) === entry.recipeId);
      const recipe = recipeEntry ? recipeDetails[recipeEntry.file] : null;
      const name = recipe ? recipe.name : entry.recipeId;
      const avg = recipe ? avgStars(entry.recipeId) : null;
      return `
        <div class="history-item">
          <span class="hdate">${formatDateKey(key)}</span>
          <span class="hname">${escapeHtml(name)}</span>
          <span class="hstars">${avg ? '★ ' + avg.toFixed(1) : '<span class="none">not yet rated</span>'}</span>
        </div>
      `;
    }).join("");
    html += `</div>`;
  }

  return html;
}

function originChipHtml(entry) {
  // "New" = found via the weekly recipe search, not yet in the family's
  // AnyList collection. Everything else ("active" or "unproven") came
  // from AnyList at some point, cooked or not, so it counts as "Existing".
  const isNew = entry.status === "candidate";
  return `<span class="origin-chip ${isNew ? "chip-new" : "chip-existing"}">${isNew ? "New" : "Existing"}</span>`;
}

function voteCardHtml(entry, weekVotes, untested) {
  const id = recipeIdFromFile(entry.file);
  const recipe = recipeDetails[entry.file];
  if (!recipe) return "";
  const count = (weekVotes[id] || []).length;
  const iVoted = (weekVotes[id] || []).includes(currentUser);
  const mins = iso8601ToMinutes(recipe.totalTime);
  const ratingLabel = untested ? "Not yet tried" : (avgStars(id) ? "★ " + avgStars(id).toFixed(1) : "Not yet rated");
  return `
    <div class="card vote-card">
      <div class="info">
        <h3>${escapeHtml(recipe.name)}</h3>
        <div class="meta-row">${mins ? `<span>${mins} min</span>` : ""}<span>${ratingLabel}</span></div>
      </div>
      <div class="vote-count">
        <button class="vote-btn ${iVoted ? "voted" : ""}" data-vote="${id}">${iVoted ? "✓" : "+"}</button>
        <span class="num">${count}</span>
      </div>
    </div>`;
}

function renderVoteView() {
  const weekVotes = votes[CURRENT_WEEK] || {};
  // "active" recipes are ones the family has actually cooked and rated
  // through this app -- the known-good pool, grouped by category below,
  // always shown first. "candidate" recipes (weekly auto-suggested,
  // awaiting review in the New tab) stay out of voting entirely.
  // "unproven" recipes (the original AnyList bulk import, never cooked
  // through this app) fill out each category up to 5 total when the
  // proven options run thin -- the active list alone is often just 1-2
  // recipes per category -- and "Show 5 more" reveals further untested
  // ones beyond that default 5.
  // Partial recipes (a sauce, marinade, dip, or other component meant to
  // accompany a dish rather than stand as the dinner itself) never belong
  // in the recommendation pool -- see entry.partial below.
  const active = recipesIndex.filter(r => r.status === "active" && !r.partial);
  const byCategorySort = (a, b) => {
    const va = (weekVotes[recipeIdFromFile(a.file)] || []).length;
    const vb = (weekVotes[recipeIdFromFile(b.file)] || []).length;
    return vb - va;
  };

  let html = `<div class="banner-info">Vote for the dinners you want this week. Tap the circle to add or remove your vote — everyone's votes update live. Don't love the options in a category? Tap "Show 5 more" to pull in recipes nobody's tried yet.</div>`;

  const orderedKeys = Object.keys(CATEGORY_LABELS);
  let anyShown = false;

  orderedKeys.forEach(key => {
    const proven = active.filter(r => r.category === key).sort(byCategorySort);
    const untestedPool = recipesIndex
      .filter(r => r.category === key && r.status === "unproven" && !r.partial)
      .sort((a, b) => {
        const ra = recipeDetails[a.file], rb = recipeDetails[b.file];
        return (ra?.name || "").localeCompare(rb?.name || "");
      });
    const combined = [...proven, ...untestedPool];
    if (!combined.length) return; // nothing at all for this category
    anyShown = true;

    const shownCount = voteExtraShown[key] || Math.min(5, combined.length);
    const visible = combined.slice(0, shownCount);
    const moreRemaining = combined.length - visible.length;

    html += `<div class="section-label">${escapeHtml(CATEGORY_LABELS[key])}</div>`;
    html += visible.map(entry => voteCardHtml(entry, weekVotes, entry.status === "unproven")).join("");
    if (moreRemaining > 0) {
      html += `<div class="removed-toggle" data-vote-more="${key}">Show ${Math.min(5, moreRemaining)} more ▼</div>`;
    }
  });

  if (!anyShown) html += `<div class="empty">No recipes yet.</div>`;
  return html;
}

function recipeSearchText(entry, recipe) {
  const ingredients = (recipe.recipeIngredient || []).join(" ");
  const tags = (entry.tags || []).join(" ");
  return [recipe.name, recipe.description, ingredients, recipe.recipeCategory, entry.category, entry.temp, tags]
    .filter(Boolean).join(" ").toLowerCase();
}

// Category/temp/tag labels shown in the filter bar. Order here is display order.
const CATEGORY_FILTERS = [
  { value: "chicken", label: "Chicken" },
  { value: "beef", label: "Beef" },
  { value: "pork", label: "Pork" },
  { value: "seafood", label: "Seafood" },
  { value: "vegetarian", label: "Vegetarian" },
];
const TEMP_FILTERS = [
  { value: "hot", label: "Hot" },
  { value: "cold", label: "Cold" },
];
// Recipes tab only -- lets James see "everything we know about" instead of
// just the cooked-and-rated "active" set, without losing the ability to
// narrow back down to just the proven ones.
const STATUS_FILTERS = [
  { value: "active", label: "Cooked & rated" },
  { value: "candidate", label: "New finds" },
  { value: "unproven", label: "From AnyList" },
];
// "Anything else" filter dimension: a small set of prep-style tags that are
// actually useful for a busy weeknight (how fast/hands-off it is, or what
// format it is), rather than trying to tag every possible attribute.
const TAG_FILTERS = [
  { value: "quick", label: "Quick" },
  { value: "slow-cooker", label: "Slow cooker" },
  { value: "one-pan", label: "One pan" },
  { value: "grill", label: "Grill" },
  { value: "pasta", label: "Pasta" },
  { value: "soup", label: "Soup" },
  { value: "salad", label: "Salad" },
  { value: "casserole", label: "Casserole" },
  { value: "stir-fry", label: "Stir-fry" },
  { value: "tacos", label: "Tacos" },
  { value: "pizza", label: "Pizza" },
];

function recipeMatchesFilters(entry) {
  if (activeCategoryFilter && entry.category !== activeCategoryFilter) return false;
  if (activeTempFilter && entry.temp !== activeTempFilter) return false;
  if (activeTagFilter && !(entry.tags || []).includes(activeTagFilter)) return false;
  return true;
}

// Recipes tab only -- always has a real value, so (unlike the other filter
// dropdowns) it never shows a blank/placeholder option.
const SORT_OPTIONS = [
  { value: "rating", label: "Highest rated" },
  { value: "name", label: "Name (A-Z)" },
  { value: "quickest", label: "Quickest to cook" },
];

function sortSelectHtml() {
  const opts = SORT_OPTIONS.map(f =>
    `<option value="${f.value}" ${activeSortBy === f.value ? "selected" : ""}>${escapeHtml(f.label)}</option>`
  ).join("");
  return `<select class="filter-select" data-sort-filter>${opts}</select>`;
}

function sortRecipeEntries(entries) {
  const byName = (a, b) => (recipeDetails[a.file]?.name || "").localeCompare(recipeDetails[b.file]?.name || "");
  if (activeSortBy === "name") {
    return [...entries].sort(byName);
  }
  if (activeSortBy === "quickest") {
    return [...entries].sort((a, b) => {
      const ma = iso8601ToMinutes(recipeDetails[a.file]?.totalTime) ?? Infinity;
      const mb = iso8601ToMinutes(recipeDetails[b.file]?.totalTime) ?? Infinity;
      if (ma !== mb) return ma - mb;
      return byName(a, b);
    });
  }
  // Default: "rating" -- highest average stars first, unrated recipes all
  // tie at the bottom, name A-Z as the tiebreaker throughout.
  return [...entries].sort((a, b) => {
    const ra = avgStars(recipeIdFromFile(a.file)) || 0;
    const rb = avgStars(recipeIdFromFile(b.file)) || 0;
    if (rb !== ra) return rb - ra;
    return byName(a, b);
  });
}

function filterSelectHtml(options, activeValue, dataAttr, placeholder) {
  const isActive = !!activeValue;
  const opts = [`<option value="">${escapeHtml(placeholder)}</option>`]
    .concat(options.map(f => `<option value="${f.value}" ${activeValue === f.value ? "selected" : ""}>${escapeHtml(f.label)}</option>`))
    .join("");
  return `<select class="filter-select ${isActive ? "active" : ""}" data-${dataAttr}>${opts}</select>`;
}

// Shared between the Home tab (everyone can see/remove) and Choose
// (James-only browsing). Day-assignment only ever shows for MENU_OWNER,
// so it appears here automatically on both.
function upNextSectionHtml() {
  const queuedIds = Object.keys(queue);
  if (!queuedIds.length) return "";
  let html = `<div class="section-label">Up next</div>`;
  html += queuedIds.map(id => {
    const entry = recipesIndex.find(r => recipeIdFromFile(r.file) === id);
    const recipe = entry ? recipeDetails[entry.file] : null;
    if (!recipe) return "";
    const q = queue[id];
    const mins = iso8601ToMinutes(recipe.totalTime);
    return `
      <div class="card queue-card">
        <div class="info">
          <h3>${escapeHtml(recipe.name)}${originChipHtml(entry)}</h3>
          <div class="meta-row">${mins ? `<span>${mins} min</span>` : ""}<span>${avgStars(id) ? '★ ' + avgStars(id).toFixed(1) : 'Not yet rated'}</span></div>
          <div class="added-by">Added by ${escapeHtml(q.addedBy || "someone")}</div>
        </div>
        <div class="candidate-actions">
          <button class="queue-btn queued" data-queue="${id}">Remove</button>
          ${currentUser === MENU_OWNER ? dayAssignSelectHtml(id) : ""}
        </div>
      </div>`;
  }).join("");
  return html;
}

function renderChooseView() {
  let html = `<div class="banner-info">Search every recipe in the family database. Add anything you're excited to eat to the shared "Up next" list, or assign it straight to a day this week.</div>`;
  html += `<input type="text" class="search-box" id="recipeSearch" placeholder="Search by name, ingredient, or type..." value="${escapeHtml(searchQuery)}">`;

  const anyFilterActive = activeCategoryFilter || activeTempFilter || activeTagFilter;
  html += `<div class="filter-bar">`;
  html += filterSelectHtml(CATEGORY_FILTERS, activeCategoryFilter, "category-filter", "Category");
  html += filterSelectHtml(TEMP_FILTERS, activeTempFilter, "temp-filter", "Temperature");
  html += filterSelectHtml(TAG_FILTERS, activeTagFilter, "tag-filter", "Style");
  if (anyFilterActive) html += `<span class="filter-clear" data-clear-filters>Clear filters</span>`;
  html += `</div>`;

  const q = searchQuery.trim().toLowerCase();

  html += upNextSectionHtml();

  // ---- Full searchable index ----
  html += `<div class="section-label">${q || anyFilterActive ? "Search results" : "All recipes"}</div>`;
  const matches = recipesIndex.filter(entry => {
    const recipe = recipeDetails[entry.file];
    if (!recipe) return false;
    // Partial recipes (a sauce, marinade, dip, etc. meant to accompany a
    // dish, not stand as the dinner itself) are kept out of plain browsing
    // -- they only surface when someone searches for them by name directly.
    if (!q && entry.partial) return false;
    if (!recipeMatchesFilters(entry)) return false;
    if (!q) return true;
    return recipeSearchText(entry, recipe).includes(q);
  });

  if (!matches.length) {
    const what = q ? `match "${escapeHtml(searchQuery)}"` : "match these filters";
    html += `<div class="empty">No recipes ${what}.</div>`;
  } else {
    html += matches.map(entry => {
      const id = recipeIdFromFile(entry.file);
      const recipe = recipeDetails[entry.file];
      const mins = iso8601ToMinutes(recipe.totalTime);
      const inQueue = !!queue[id];
      return `
        <div class="card queue-card">
          <div class="info">
            <h3>${escapeHtml(recipe.name)}${originChipHtml(entry)}</h3>
            <p class="desc">${escapeHtml(recipe.description || "")}</p>
            <div class="meta-row">${mins ? `<span>${mins} min</span>` : ""}<span>${avgStars(id) ? '★ ' + avgStars(id).toFixed(1) : 'Not yet rated'}</span></div>
          </div>
          <div class="candidate-actions">
            <button class="queue-btn ${inQueue ? 'queued' : ''}" data-queue="${id}">${inQueue ? 'Added' : 'Add'}</button>
            ${currentUser === MENU_OWNER ? dayAssignSelectHtml(id) : ""}
          </div>
        </div>`;
    }).join("");
  }

  return html;
}

function renderRecipesView() {
  // Shows every known recipe -- active, candidate, and unproven alike --
  // not just the cooked-and-rated "active" set. The Status filter below
  // (Recipes tab only, never shared with Choose) is how James narrows
  // back down to just the proven ones when he wants that shorter list.
  let html = `<div class="filter-bar">`;
  html += sortSelectHtml();
  html += filterSelectHtml(STATUS_FILTERS, activeStatusFilter, "status-filter", "Status");
  html += filterSelectHtml(CATEGORY_FILTERS, activeCategoryFilter, "category-filter", "Category");
  html += filterSelectHtml(TEMP_FILTERS, activeTempFilter, "temp-filter", "Temperature");
  html += filterSelectHtml(TAG_FILTERS, activeTagFilter, "tag-filter", "Style");
  const anyFilterActive = activeStatusFilter || activeCategoryFilter || activeTempFilter || activeTagFilter;
  if (anyFilterActive) html += `<span class="filter-clear" data-clear-filters>Clear filters</span>`;
  html += `</div>`;

  const all = recipesIndex.filter(entry => {
    if (activeStatusFilter && entry.status !== activeStatusFilter) return false;
    return recipeMatchesFilters(entry);
  });
  const freshSorted = sortRecipeEntries(all);

  // A change to the filters, status, or sort method (or the first time this
  // tab is viewed) applies instantly -- that's a deliberate action and
  // should feel snappy. Anything else (a rating syncing in live from
  // someone else's phone) only reorders the list after a quiet period, so
  // cards don't jump around under James's thumb mid-scroll.
  const filterSignature = JSON.stringify([activeStatusFilter, activeCategoryFilter, activeTempFilter, activeTagFilter, activeSortBy]);
  let displayEntries;

  if (filterSignature !== recipesSortSignature) {
    recipesSortSignature = filterSignature;
    recipesDisplayOrder = freshSorted.map(e => e.file);
    if (recipesResortTimer) { clearTimeout(recipesResortTimer); recipesResortTimer = null; recipesPendingTarget = null; }
    displayEntries = freshSorted;
  } else {
    const byFile = new Map(all.map(e => [e.file, e]));
    const ordered = recipesDisplayOrder.map(f => byFile.get(f)).filter(Boolean);
    const seen = new Set(ordered.map(e => e.file));
    const newcomers = freshSorted.filter(e => !seen.has(e.file));
    displayEntries = [...ordered, ...newcomers];

    const targetSignature = freshSorted.map(e => e.file).join("|");
    const currentSignature = displayEntries.map(e => e.file).join("|");

    if (targetSignature !== currentSignature) {
      if (targetSignature !== recipesPendingTarget) {
        if (recipesResortTimer) clearTimeout(recipesResortTimer);
        recipesPendingTarget = targetSignature;
        recipesResortTimer = setTimeout(() => {
          recipesResortTimer = null;
          recipesPendingTarget = null;
          recipesDisplayOrder = targetSignature ? targetSignature.split("|") : [];
          render();
        }, RECIPES_RESORT_DEBOUNCE_MS);
      }
      // else: already waiting out this exact target order -- let it ride.
    } else if (recipesResortTimer) {
      clearTimeout(recipesResortTimer);
      recipesResortTimer = null;
      recipesPendingTarget = null;
    }
  }

  if (!displayEntries.length) {
    html += `<div class="empty">No recipes match these filters.</div>`;
    return html;
  }

  html += displayEntries.map(entry => {
    const id = recipeIdFromFile(entry.file);
    const recipe = recipeDetails[entry.file];
    if (!recipe) return "";
    const mins = iso8601ToMinutes(recipe.totalTime);

    return `
      <div class="card">
        <h3>${escapeHtml(recipe.name)}${originChipHtml(entry)}</h3>
        <p class="desc">${escapeHtml(recipe.description || "")}</p>
        <div class="meta-row">${mins ? `<span>${mins} min</span>` : ""}${recipe.recipeYield ? `<span>${escapeHtml(String(recipe.recipeYield))}</span>` : ""}</div>
        ${ratingWidgetHtml(id, recipe)}
      </div>`;
  }).join("");

  return html;
}

// Same category labels as the Choose filters, used to group the week's
// candidates (falls back to "Other" for anything uncategorized).
const CATEGORY_LABELS = { chicken: "Chicken", beef: "Beef", pork: "Pork", seafood: "Seafood", vegetarian: "Vegetarian" };

function renderNewView() {
  const allCandidates = recipesIndex.filter(r => r.status === "candidate");
  const candidates = allCandidates.filter(r => !overrides[recipeIdFromFile(r.file)]?.removed);
  const removedCandidates = allCandidates.filter(r => overrides[recipeIdFromFile(r.file)]?.removed);

  let html = `<div class="banner-info">Fresh recipe candidates James finds each Sunday — tap "Add" to put one on the shared "Up next" list. Once your family cooks and rates one, it moves into the regular rotation automatically. Not interested in one? Tap "Remove" — it won't show up again unless you bring it back.</div>`;

  if (!candidates.length) {
    html += `<div class="empty">No new candidates right now. Check back Sunday.</div>`;
  } else {
    // Group by category so the weekly batch reads as "3 chicken, 3 beef, ..."
    // rather than one flat list.
    const groups = {};
    candidates.forEach(entry => {
      const key = entry.category || "other";
      (groups[key] = groups[key] || []).push(entry);
    });
    const orderedKeys = Object.keys(CATEGORY_LABELS).filter(k => groups[k]).concat(Object.keys(groups).filter(k => !CATEGORY_LABELS[k]));

    orderedKeys.forEach(key => {
      html += `<div class="section-label">${escapeHtml(CATEGORY_LABELS[key] || "Other")}</div>`;
      html += groups[key].map(entry => {
        const id = recipeIdFromFile(entry.file);
        const recipe = recipeDetails[entry.file];
        if (!recipe) return "";
        const mins = iso8601ToMinutes(recipe.totalTime);
        const inQueue = !!queue[id];
        return `
          <div class="card queue-card">
            <div class="info">
              <h3>${escapeHtml(recipe.name)}</h3>
              <p class="desc">${escapeHtml(recipe.description || "")}</p>
              <div class="meta-row">${mins ? `<span>${mins} min</span>` : ""}</div>
            </div>
            <div class="candidate-actions">
              <button class="queue-btn ${inQueue ? 'queued' : ''}" data-queue="${id}">${inQueue ? 'Added' : 'Add'}</button>
              <button class="candidate-remove-btn" data-remove="${id}" title="Not interested — hide this candidate">Remove</button>
            </div>
          </div>`;
      }).join("");
    });
  }

  // "Removed" candidates stay recoverable, collapsed by default so a long
  // dismissal history doesn't clutter the tab — tap to expand and restore.
  if (removedCandidates.length) {
    html += `<div class="removed-toggle" data-toggle-removed>${showRemovedCandidates ? "Hide" : "Show"} removed (${removedCandidates.length}) ${showRemovedCandidates ? "▲" : "▼"}</div>`;
    if (showRemovedCandidates) {
      html += removedCandidates.map(entry => {
        const id = recipeIdFromFile(entry.file);
        const recipe = recipeDetails[entry.file];
        if (!recipe) return "";
        const mins = iso8601ToMinutes(recipe.totalTime);
        return `
          <div class="card queue-card removed-card">
            <div class="info">
              <h3>${escapeHtml(recipe.name)}</h3>
              <p class="desc">${escapeHtml(recipe.description || "")}</p>
              <div class="meta-row">${mins ? `<span>${mins} min</span>` : ""}</div>
            </div>
            <button class="queue-btn" data-restore="${id}">Restore</button>
          </div>`;
      }).join("");
    }
  }

  return html;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function render() {
  if (!currentUser) return;
  // Defensive: Choose is James-only. Even if activeView were somehow left
  // on "choose" for someone else (stale state, a switched user, etc.),
  // never render its content for them -- fall back to Home instead.
  if (activeView === "choose" && currentUser !== MENU_OWNER) activeView = "tonight";
  const main = document.getElementById("main");
  let html = "";
  if (firebaseStatus === "unavailable") {
    html += `<div class="banner-info" style="color:var(--accent-red)">Not connected to the shared database right now, so ratings and votes from others won't show up and yours won't save. Check your internet connection and reopen the app.</div>`;
  }
  if (activeView === "tonight") html += renderTonightView();
  else if (activeView === "vote") html += renderVoteView();
  else if (activeView === "choose") html += renderChooseView();
  else if (activeView === "recipes") html += renderRecipesView();
  else html += renderNewView();
  main.innerHTML = html;
  attachHandlers();
}

function attachHandlers() {
  document.querySelectorAll("[data-move-meal]").forEach(sel => {
    sel.onchange = () => {
      const fromKey = sel.dataset.moveMeal;
      const toKey = sel.value;
      sel.value = ""; // one-shot action, not a persistent field
      if (!toKey) return;
      const recipeId = menu[fromKey]?.recipeId || null;
      if (!recipeId) return;
      const existingId = menu[toKey]?.recipeId || null;
      if (existingId && existingId !== recipeId) {
        const existingEntry = recipesIndex.find(r => recipeIdFromFile(r.file) === existingId);
        const existingRecipe = existingEntry ? recipeDetails[existingEntry.file] : null;
        const movingEntry = recipesIndex.find(r => recipeIdFromFile(r.file) === recipeId);
        const movingRecipe = movingEntry ? recipeDetails[movingEntry.file] : null;
        const ok = confirm(
          `Replace ${friendlyDateLabel(toKey)}'s dinner (currently ${existingRecipe ? existingRecipe.name : "something"}) with ${movingRecipe ? movingRecipe.name : "this"}?`
        );
        if (!ok) return;
      }
      setTonightRecipe(toKey, recipeId);
      setTonightRecipe(fromKey, null);
    };
  });
  document.querySelectorAll("[data-day-assign]").forEach(sel => {
    sel.onchange = () => {
      const recipeId = sel.dataset.dayAssign;
      const dateKey = sel.value;
      sel.value = ""; // one-shot action, not a persistent field
      if (!dateKey) return;
      const existingId = menu[dateKey]?.recipeId || null;
      if (existingId && existingId !== recipeId) {
        const existingEntry = recipesIndex.find(r => recipeIdFromFile(r.file) === existingId);
        const existingRecipe = existingEntry ? recipeDetails[existingEntry.file] : null;
        const newEntry = recipesIndex.find(r => recipeIdFromFile(r.file) === recipeId);
        const newRecipe = newEntry ? recipeDetails[newEntry.file] : null;
        const ok = confirm(
          `Replace ${friendlyDateLabel(dateKey)}'s dinner (currently ${existingRecipe ? existingRecipe.name : "something"}) with ${newRecipe ? newRecipe.name : "this"}?`
        );
        if (!ok) return;
      }
      setTonightRecipe(dateKey, recipeId);
    };
  });
  document.querySelectorAll("[data-vote]").forEach(btn => {
    btn.onclick = () => toggleVote(btn.dataset.vote);
  });
  document.querySelectorAll("[data-vote-more]").forEach(btn => {
    btn.onclick = () => {
      const cat = btn.dataset.voteMore;
      voteExtraShown[cat] = (voteExtraShown[cat] || 5) + 5;
      render();
    };
  });
  document.querySelectorAll("[data-queue]").forEach(btn => {
    btn.onclick = () => toggleQueue(btn.dataset.queue);
  });
  document.querySelectorAll("[data-remove]").forEach(btn => {
    btn.onclick = () => setRemoved(btn.dataset.remove, true);
  });
  document.querySelectorAll("[data-restore]").forEach(btn => {
    btn.onclick = () => setRemoved(btn.dataset.restore, false);
  });
  const toggleRemovedEl = document.querySelector("[data-toggle-removed]");
  if (toggleRemovedEl) {
    toggleRemovedEl.onclick = () => {
      showRemovedCandidates = !showRemovedCandidates;
      render();
    };
  }
  const recipeSearch = document.getElementById("recipeSearch");
  if (recipeSearch) {
    // Re-render on input (to filter live), but restore focus + cursor
    // position afterward since innerHTML replacement would otherwise
    // knock focus out of the field on every keystroke.
    recipeSearch.oninput = () => {
      searchQuery = recipeSearch.value;
      const pos = recipeSearch.selectionStart;
      render();
      const restored = document.getElementById("recipeSearch");
      if (restored) {
        restored.focus();
        restored.setSelectionRange(pos, pos);
      }
    };
  }
  const sortFilterSelect = document.querySelector("[data-sort-filter]");
  if (sortFilterSelect) {
    sortFilterSelect.onchange = () => {
      activeSortBy = sortFilterSelect.value || "rating";
      render();
    };
  }
  const statusFilterSelect = document.querySelector("[data-status-filter]");
  if (statusFilterSelect) {
    statusFilterSelect.onchange = () => {
      activeStatusFilter = statusFilterSelect.value || null;
      render();
    };
  }
  const categoryFilterSelect = document.querySelector("[data-category-filter]");
  if (categoryFilterSelect) {
    categoryFilterSelect.onchange = () => {
      activeCategoryFilter = categoryFilterSelect.value || null;
      render();
    };
  }
  const tempFilterSelect = document.querySelector("[data-temp-filter]");
  if (tempFilterSelect) {
    tempFilterSelect.onchange = () => {
      activeTempFilter = tempFilterSelect.value || null;
      render();
    };
  }
  const tagFilterSelect = document.querySelector("[data-tag-filter]");
  if (tagFilterSelect) {
    tagFilterSelect.onchange = () => {
      activeTagFilter = tagFilterSelect.value || null;
      render();
    };
  }
  const clearFiltersBtn = document.querySelector("[data-clear-filters]");
  if (clearFiltersBtn) {
    clearFiltersBtn.onclick = () => {
      activeStatusFilter = null;
      activeCategoryFilter = null;
      activeTempFilter = null;
      activeTagFilter = null;
      render();
    };
  }
  document.querySelectorAll(".stars button[data-star]").forEach(btn => {
    btn.onclick = () => setRating(btn.dataset.recipe, parseInt(btn.dataset.star, 10));
  });
  document.querySelectorAll("[data-scale-toggle]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.scaleToggle;
      if (expandedScaleLegends.has(id)) expandedScaleLegends.delete(id);
      else expandedScaleLegends.add(id);
      render();
    };
  });
  document.querySelectorAll("textarea.comment").forEach(ta => {
    let timer;
    ta.oninput = () => {
      clearTimeout(timer);
      const hint = document.querySelector(`[data-hint="${ta.dataset.recipe}"]`);
      if (hint) hint.textContent = "Typing…";
      timer = setTimeout(async () => {
        await setRating(ta.dataset.recipe, undefined, ta.value);
        if (hint) {
          hint.textContent = "Saved";
          setTimeout(() => { if (hint.textContent === "Saved") hint.textContent = ""; }, 1500);
        }
      }, 700);
    };
  });
}

// ---------- Name picker / onboarding ----------
function renderNamePicker() {
  const list = document.getElementById("nameList");
  list.innerHTML = FAMILY_MEMBERS.map(name =>
    `<button class="name-btn" data-name="${name}">${name}</button>`
  ).join("");
  list.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      currentUser = btn.dataset.name;
      localStorage.setItem("familyDinners.user", currentUser);
      showApp();
    };
  });
}

function showApp() {
  document.getElementById("namePicker").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("whoLabel").textContent = currentUser;
  // Choose (search/browse/day-assignment) is James-only -- the shared Up
  // Next list everyone else still gets lives on Home instead (see
  // upNextSectionHtml, called from renderTonightView).
  const chooseBtn = document.querySelector('nav.tabs button[data-view="choose"]');
  if (chooseBtn) chooseBtn.style.display = currentUser === MENU_OWNER ? "" : "none";
  if (activeView === "choose" && currentUser !== MENU_OWNER) {
    activeView = "tonight";
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    const tonightBtn = document.querySelector('nav.tabs button[data-view="tonight"]');
    if (tonightBtn) tonightBtn.classList.add("active");
  }
  render();
}

document.getElementById("switchUser").onclick = () => {
  currentUser = null;
  localStorage.removeItem("familyDinners.user");
  document.getElementById("app").style.display = "none";
  document.getElementById("namePicker").style.display = "flex";
};

document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.onclick = () => {
    activeView = btn.dataset.view;
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  };
});

// ---------- Boot ----------
(async function init() {
  renderNamePicker();
  await loadRecipes();
  if (currentUser && FAMILY_MEMBERS.includes(currentUser)) {
    showApp();
  }
  initFirebase(); // runs in background; app is usable before this resolves
})();

// Register service worker for installability (best-effort; ignore failures)
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
