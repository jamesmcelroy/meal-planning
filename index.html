<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Family Dinners</title>
<meta name="description" content="Rate recipes and vote on next week's dinners.">

<!-- iOS Home Screen / PWA support -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dinners">
<meta name="theme-color" content="#f2f2f7">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<style>
  /*
    Styled from the "iOS Native" design system — Apple HIG tokens for
    color (light/dark), SF Pro type scale, 8pt spacing grid, squircle
    radii, and restrained shadows. See design-system tokens.json for the
    source values and contrast notes.
  */
  :root{
    --label:#000000; --label-secondary:#8a8a8e; --label-tertiary:#c4c4c6;
    --surface-primary:#ffffff; --surface-secondary:#f2f2f7; --surface-tertiary:#ffffff; --surface-grouped:#f2f2f7;
    --separator:#c6c6c8; --separator-opaque:#c6c6c8; --fill-quaternary:#f2f2f7;
    --gray:#8e8e93; --gray-2:#aeaeb2; --gray-3:#c7c7cc; --gray-4:#d1d1d6; --gray-5:#e5e5ea; --gray-6:#f2f2f7;
    --accent-blue:#007aff; --accent-red:#ff3b30; --accent-green:#34c759; --accent-orange:#ff9500;
    --accent-yellow:#ffcc00; --accent-mint:#00c7be; --accent-teal:#30b0c7; --accent-cyan:#32ade6;
    --accent-indigo:#5856d6; --accent-purple:#af52de; --accent-pink:#ff2d55; --accent-brown:#a2845e;
    --shadow-raised:0px 2px 12px rgba(0,0,0,0.12); --shadow-modal:0px 8px 30px rgba(0,0,0,0.2);
    --font-display:-apple-system,'SF Pro Display',system-ui,sans-serif;
    --font-text:-apple-system,'SF Pro Text',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --label:#ffffff; --label-secondary:#8d8d93; --label-tertiary:#47474a;
      --surface-primary:#000000; --surface-secondary:#1c1c1e; --surface-tertiary:#2c2c2e; --surface-grouped:#000000;
      --separator:#323235; --separator-opaque:#38383a; --fill-quaternary:#1c1c1e;
      --gray:#8e8e93; --gray-2:#636366; --gray-3:#48484a; --gray-4:#3a3a3c; --gray-5:#2c2c2e; --gray-6:#1c1c1e;
      --accent-blue:#0a84ff; --accent-red:#ff453a; --accent-green:#30d158; --accent-orange:#ff9f0a;
      --accent-yellow:#ffd60a; --accent-mint:#63e6e2; --accent-teal:#40cbe0; --accent-cyan:#64d2ff;
      --accent-indigo:#5e5ce6; --accent-purple:#bf5af2; --accent-pink:#ff375f; --accent-brown:#ac8e68;
      --shadow-raised:0px 2px 12px rgba(0,0,0,0.4); --shadow-modal:0px 8px 30px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --label:#ffffff; --label-secondary:#8d8d93; --label-tertiary:#47474a;
    --surface-primary:#000000; --surface-secondary:#1c1c1e; --surface-tertiary:#2c2c2e; --surface-grouped:#000000;
    --separator:#323235; --separator-opaque:#38383a; --fill-quaternary:#1c1c1e;
    --gray:#8e8e93; --gray-2:#636366; --gray-3:#48484a; --gray-4:#3a3a3c; --gray-5:#2c2c2e; --gray-6:#1c1c1e;
    --accent-blue:#0a84ff; --accent-red:#ff453a; --accent-green:#30d158; --accent-orange:#ff9f0a;
    --accent-yellow:#ffd60a; --accent-mint:#63e6e2; --accent-teal:#40cbe0; --accent-cyan:#64d2ff;
    --accent-indigo:#5e5ce6; --accent-purple:#bf5af2; --accent-pink:#ff375f; --accent-brown:#ac8e68;
    --shadow-raised:0px 2px 12px rgba(0,0,0,0.4); --shadow-modal:0px 8px 30px rgba(0,0,0,0.55);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--surface-grouped);color:var(--label);font-family:var(--font-text);font-weight:400;
    -webkit-font-smoothing:antialiased;
    font-size:17px;line-height:22px;letter-spacing:-0.43px; /* body */
    min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{font-family:var(--font-display)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit}

  /* ---------- App shell ---------- */
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header.top{
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background:color-mix(in srgb, var(--surface-secondary) 92%, transparent);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:0.5px solid var(--separator);
    color:var(--label);
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;
  }
  header.top h1{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-0.43px;color:var(--label)} /* headline */
  header.top .who{font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);display:flex;align-items:center;gap:8px} /* footnote */
  header.top .who button{color:var(--accent-blue);font-size:13px;font-weight:400}
  main{flex:1;padding:16px 16px 100px}

  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;
    background:color-mix(in srgb, var(--surface-secondary) 92%, transparent);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:0.5px solid var(--separator);
    display:flex;max-width:640px;margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom);
    z-index:10;
  }
  nav.tabs button{
    flex:1;padding:6px 4px;min-height:44px;font-size:11px;line-height:13px;letter-spacing:0.06px;color:var(--gray);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  } /* caption-2 */
  nav.tabs button .ic{font-size:22px;line-height:1;filter:grayscale(1);opacity:0.7}
  nav.tabs button.active{color:var(--accent-blue);font-weight:600}
  nav.tabs button.active .ic{filter:none;opacity:1}

  /* ---------- Name picker (onboarding) ---------- */
  #namePicker{
    position:fixed;inset:0;background:var(--surface-grouped);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  }
  #namePicker h2{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-0.36px;margin-bottom:6px;text-align:center;color:var(--label)} /* title-1 */
  #namePicker p{font-size:15px;line-height:20px;letter-spacing:-0.24px;color:var(--label-secondary);margin-bottom:32px;text-align:center} /* subheadline */
  .name-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}
  .name-btn{
    padding:14px 16px;min-height:44px;border-radius:14px;background:var(--surface-tertiary);
    font-size:17px;line-height:22px;letter-spacing:-0.43px;font-weight:600;color:var(--label);
    text-align:left;
  } /* headline, radius-lg */
  .name-btn:active{background:var(--fill-quaternary)}

  /* ---------- Cards ---------- */
  .card{
    background:var(--surface-tertiary);border-radius:14px;padding:16px;margin-bottom:12px;
  } /* radius-lg, shadow-none by default per HIG deference */
  .card h3{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-0.24px;color:var(--label);margin-bottom:2px} /* title-3 */
  .card .desc{font-size:15px;line-height:20px;letter-spacing:-0.24px;color:var(--label-secondary);margin-bottom:10px} /* subheadline */
  .card .meta-row{display:flex;gap:12px;font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);margin-bottom:12px} /* footnote */
  .stars-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .stars{display:flex;gap:4px}
  .stars button{font-size:24px;line-height:1;color:var(--gray-4);min-width:32px;min-height:32px}
  .stars button.filled{color:var(--accent-orange)}
  .scale-toggle{
    font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--accent-blue);
    white-space:nowrap;
  } /* footnote, accent-blue is safe for body-size text per HIG */
  .scale-legend{
    font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label);background:var(--surface-secondary);border-radius:10px;padding:10px 12px;
    margin-bottom:10px;
  } /* footnote, radius-md */
  .scale-legend div{display:flex;gap:6px;padding:2px 0}
  .scale-legend b{color:var(--label-secondary);min-width:16px;font-weight:600}
  .avg-row{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--label-secondary);margin-bottom:10px}
  .avg-row .n{color:var(--label-tertiary)}
  .per-person{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:13px;line-height:18px;letter-spacing:-0.08px;background:var(--fill-quaternary);border-radius:9999px;padding:4px 10px;color:var(--label-secondary)} /* footnote, radius-full */
  .chip strong{color:var(--label);font-weight:600}
  textarea.comment{
    width:100%;border:none;border-radius:10px;padding:10px 12px;font-size:15px;line-height:20px;letter-spacing:-0.24px;
    min-height:56px;resize:vertical;background:var(--surface-secondary);color:var(--label);
  } /* subheadline, radius-md */
  textarea.comment::placeholder{color:var(--label-tertiary)}
  .comment-list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .comment-item{font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);background:var(--surface-secondary);border-radius:10px;padding:8px 10px}
  .comment-item b{color:var(--label);font-weight:600}
  .save-hint{font-size:11px;line-height:13px;letter-spacing:0.06px;color:var(--label-tertiary);margin-top:6px;height:14px} /* caption-2 */

  /* ---------- Vote view ---------- */
  .vote-card{display:flex;align-items:center;gap:14px}
  .vote-card .info{flex:1}
  .vote-count{
    display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;
  }
  .vote-count .num{font-family:var(--font-display);font-size:20px;line-height:25px;font-weight:700;color:var(--label)} /* title-3 */
  .vote-btn{
    width:44px;height:44px;border-radius:9999px;background:var(--fill-quaternary);font-size:20px;color:var(--accent-blue);
  } /* radius-full, min tap target */
  .vote-btn.voted{background:var(--accent-blue);color:#ffffff}
  .section-label{font-size:13px;line-height:18px;letter-spacing:-0.08px;text-transform:uppercase;color:var(--label-secondary);margin:24px 0 8px;padding:0 4px} /* footnote, space-6 */
  .section-label:first-child{margin-top:0}
  .empty{color:var(--label-secondary);text-align:center;padding:40px 20px;font-size:15px;line-height:20px}
  .banner-info{background:var(--surface-secondary);border-radius:10px;padding:12px 14px;font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);margin-bottom:16px} /* footnote, radius-md, no colored border per HIG deference */

  /* ---------- Tonight view ---------- */
  .tonight-card{
    background:var(--label);color:var(--surface-primary);border-radius:20px;padding:20px 18px;margin-bottom:16px;
  } /* radius-xl for the featured presented surface */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tonight-card{background:var(--surface-tertiary);color:var(--label)}
  }
  :root[data-theme="dark"] .tonight-card{background:var(--surface-tertiary);color:var(--label)}
  .tonight-card .label{font-size:13px;line-height:18px;letter-spacing:-0.08px;text-transform:uppercase;color:var(--accent-orange);margin-bottom:6px;opacity:0.9}
  .tonight-card h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-0.26px;margin-bottom:4px} /* title-2 */
  .tonight-card .desc{font-size:15px;line-height:20px;letter-spacing:-0.24px;opacity:0.7;margin-bottom:14px}
  .tonight-card .stars button{color:rgba(255,255,255,0.3)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tonight-card .stars button{color:var(--gray-4)} }
  :root[data-theme="dark"] .tonight-card .stars button{color:var(--gray-4)}
  .tonight-card .stars button.filled{color:var(--accent-orange) !important}
  .tonight-card .scale-toggle{color:var(--accent-cyan)}
  .tonight-card .scale-legend{background:rgba(255,255,255,0.08);color:inherit}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tonight-card .scale-legend{background:var(--surface-secondary)} }
  :root[data-theme="dark"] .tonight-card .scale-legend{background:var(--surface-secondary)}
  .tonight-card .scale-legend b{color:rgba(255,255,255,0.6)}
  .tonight-card textarea.comment{background:rgba(255,255,255,0.1);color:inherit}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tonight-card textarea.comment{background:var(--surface-secondary)} }
  :root[data-theme="dark"] .tonight-card textarea.comment{background:var(--surface-secondary)}
  .tonight-card textarea.comment::placeholder{color:rgba(255,255,255,0.4)}
  .tonight-card .save-hint{color:rgba(255,255,255,0.5)}
  .tonight-card .per-person{margin-top:14px}
  .tonight-card .chip{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tonight-card .chip{background:var(--fill-quaternary);color:var(--label-secondary)} }
  :root[data-theme="dark"] .tonight-card .chip{background:var(--fill-quaternary);color:var(--label-secondary)}
  .tonight-card .chip strong{color:#ffffff}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tonight-card .chip strong{color:var(--label)} }
  :root[data-theme="dark"] .tonight-card .chip strong{color:var(--label)}
  .tonight-card .comment-item{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.75)}
  .tonight-card .comment-item b{color:#ffffff}

  .set-menu{
    background:var(--surface-tertiary);border-radius:14px;padding:14px 16px;margin-bottom:16px;
  } /* radius-lg */
  .set-menu .label{font-size:13px;line-height:18px;letter-spacing:-0.08px;text-transform:uppercase;color:var(--label-secondary);margin-bottom:10px}
  .set-menu select{
    width:100%;padding:12px;min-height:44px;border:none;border-radius:10px;background:var(--surface-secondary);color:var(--label);
    font-size:17px;line-height:22px;letter-spacing:-0.43px;font-family:inherit;
  } /* radius-md, body */

  /* ---------- Choose view (search + shared queue) ---------- */
  .search-box{
    width:100%;padding:12px 14px;min-height:44px;border:none;border-radius:10px;background:var(--surface-tertiary);color:var(--label);
    font-size:17px;line-height:22px;letter-spacing:-0.43px;font-family:inherit;margin-bottom:16px;
  } /* radius-md, body */
  .search-box::placeholder{color:var(--label-tertiary)}
  .queue-card{display:flex;align-items:center;gap:14px}
  .queue-card .info{flex:1}
  .queue-card .added-by{font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);margin-top:2px}
  .queue-btn{
    min-width:44px;height:44px;padding:0 14px;border-radius:9999px;background:var(--fill-quaternary);
    font-size:15px;font-weight:600;letter-spacing:-0.24px;color:var(--accent-blue);white-space:nowrap;
  } /* radius-full, min tap target */
  .queue-btn.queued{background:var(--accent-blue);color:#ffffff}
  .history-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 0;border-bottom:0.5px solid var(--separator);
  }
  .history-item:last-child{border-bottom:none}
  .history-item .hdate{font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label-secondary);min-width:64px}
  .history-item .hname{font-size:15px;line-height:20px;letter-spacing:-0.24px;color:var(--label);flex:1}
  .history-item .hstars{font-size:13px;color:var(--accent-orange);white-space:nowrap;font-weight:600}
  .history-item .hstars .none{color:var(--label-tertiary);font-style:normal;font-size:13px;font-weight:400}
</style>
</head>
<body>

<div id="namePicker">
  <h2>Who's rating tonight?</h2>
  <p>Pick your name to get started</p>
  <div class="name-list" id="nameList"></div>
</div>

<div id="app" style="display:none">
  <header class="top">
    <h1>Family Dinners</h1>
    <div class="who">
      <span id="whoLabel"></span>
      <button id="switchUser">Switch</button>
    </div>
  </header>

  <main id="main"></main>

  <nav class="tabs">
    <button data-view="tonight" class="active"><span class="ic">🍽️</span>Tonight</button>
    <button data-view="vote"><span class="ic">🗳️</span>Vote</button>
    <button data-view="choose"><span class="ic">🔍</span>Choose</button>
    <button data-view="recipes"><span class="ic">📖</span>Recipes</button>
    <button data-view="new"><span class="ic">✨</span>New</button>
  </nav>
</div>

<script type="module">
const FAMILY_MEMBERS = ["James", "Roisin", "Colbie", "Bryce", "Gage"];
const MENU_OWNER = "James"; // only this person can set what's cooking each night

// Firebase is loaded dynamically and lazily so that a network hiccup or a
// blocked CDN doesn't take down the whole app — the name picker, recipe
// browsing, and navigation all work even if Firebase never connects. Only
// live sync of ratings/votes depends on it.
let db = null;
let fb = null; // holds { doc, setDoc, onSnapshot, collection }
let firebaseStatus = "connecting"; // "connecting" | "connected" | "unavailable"

async function initFirebase() {
  try {
    const [{ initializeApp }, firestoreMod, { firebaseConfig }] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"),
      import("./firebase-config.js")
    ]);
    if (firebaseConfig.apiKey === "YOUR_API_KEY") {
      console.warn("firebase-config.js still has placeholder values — see SETUP.md");
      firebaseStatus = "unavailable";
      render();
      return;
    }
    const fbApp = initializeApp(firebaseConfig);
    db = firestoreMod.getFirestore(fbApp);
    fb = firestoreMod;
    firebaseStatus = "connected";
    listenToRatings();
    listenToVotes();
    listenToMenu();
    listenToQueue();
    render();
  } catch (e) {
    console.error("Firebase failed to load — app will run in read-only/offline mode.", e);
    firebaseStatus = "unavailable";
    render();
  }
}

// ---------- State ----------
let currentUser = localStorage.getItem("familyDinners.user") || null;
let recipesIndex = [];       // from recipes.json
let recipeDetails = {};      // file -> parsed recipe object
let ratings = {};            // recipeId -> { personName: {stars, comment} }
let votes = {};              // weekKey -> { recipeId: [personNames] }
let menu = {};                // dateKey (YYYY-MM-DD, Eastern) -> { recipeId, setBy, setAt }
let queue = {};               // recipeId -> { addedBy, addedAt } — shared "up next" shortlist, anyone can add/remove
let activeView = "tonight";
let searchQuery = "";
const expandedScaleLegends = new Set(); // recipeIds currently showing the "what do stars mean" legend

const CURRENT_WEEK = getWeekKey();
const TODAY_KEY = getDateKey();

function getWeekKey(d = new Date()) {
  // ISO-ish week key: YYYY-Www, using US Eastern-style Monday start.
  const date = new Date(d);
  date.setHours(0,0,0,0);
  const day = date.getDay() || 7;
  date.setDate(date.getDate() + 1 - day);
  const yearStart = new Date(date.getFullYear(),0,1);
  const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return `${date.getFullYear()}-W${String(weekNo).padStart(2,"0")}`;
}

function getDateKey(d = new Date()) {
  // YYYY-MM-DD in US Eastern time, so "tonight" means the same thing for
  // everyone in the family regardless of the device's local timezone.
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"
  }).formatToParts(d).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
  return `${parts.year}-${parts.month}-${parts.day}`;
}

function formatDateKey(key) {
  // "2026-09-27" -> "Sun, Sep 27"
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(Date.UTC(y, m - 1, d, 12));
  return new Intl.DateTimeFormat("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" }).format(date);
}

function recipeIdFromFile(file) {
  return file.replace(/\.html$/, "");
}

// ---------- Load recipes.json + parse each recipe's JSON-LD ----------
async function loadRecipes() {
  const res = await fetch("recipes.json", {cache: "no-store"});
  const data = await res.json();
  recipesIndex = data.recipes.filter(r => r.status !== "retired");

  await Promise.all(recipesIndex.map(async (entry) => {
    try {
      const html = await (await fetch(entry.file, {cache: "no-store"})).text();
      const match = html.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/);
      if (match) {
        const json = JSON.parse(match[1]);
        recipeDetails[entry.file] = json;
      }
    } catch (e) {
      console.error("Failed to load recipe", entry.file, e);
    }
  }));
}

// ---------- Firestore live sync ----------
function listenToRatings() {
  if (!db) return;
  fb.onSnapshot(fb.collection(db, "ratings"), (snap) => {
    ratings = {};
    snap.forEach(docSnap => {
      ratings[docSnap.id] = docSnap.data().people || {};
    });
    render();
  }, (err) => console.error("ratings listener error", err));
}

function listenToVotes() {
  if (!db) return;
  fb.onSnapshot(fb.collection(db, "votes"), (snap) => {
    votes = {};
    snap.forEach(docSnap => {
      votes[docSnap.id] = docSnap.data();
    });
    render();
  }, (err) => console.error("votes listener error", err));
}

function listenToMenu() {
  if (!db) return;
  fb.onSnapshot(fb.collection(db, "menu"), (snap) => {
    menu = {};
    snap.forEach(docSnap => {
      menu[docSnap.id] = docSnap.data();
    });
    render();
  }, (err) => console.error("menu listener error", err));
}

function listenToQueue() {
  if (!db) return;
  // The shared queue lives in a single doc (queue/shared) since it's an
  // unordered shortlist, not scoped to a week like votes.
  fb.onSnapshot(fb.doc(db, "queue", "shared"), (docSnap) => {
    queue = docSnap.exists() ? (docSnap.data() || {}) : {};
    render();
  }, (err) => console.error("queue listener error", err));
}

async function setRating(recipeId, stars, comment) {
  if (!currentUser) return;
  if (!db) { alert("Not connected — ratings can't be saved right now. Check your internet connection."); return; }
  const ref = fb.doc(db, "ratings", recipeId);
  const existing = ratings[recipeId] || {};
  const updated = {
    ...existing,
    [currentUser]: {
      stars: stars ?? (existing[currentUser]?.stars ?? null),
      comment: comment !== undefined ? comment : (existing[currentUser]?.comment ?? ""),
      updatedAt: new Date().toISOString()
    }
  };
  await fb.setDoc(ref, { people: updated }, { merge: true });
}

async function toggleVote(recipeId) {
  if (!currentUser) return;
  if (!db) { alert("Not connected — votes can't be saved right now. Check your internet connection."); return; }
  const ref = fb.doc(db, "votes", CURRENT_WEEK);
  const weekVotes = votes[CURRENT_WEEK] || {};
  const current = weekVotes[recipeId] || [];
  const already = current.includes(currentUser);
  const updated = already
    ? current.filter(n => n !== currentUser)
    : [...current, currentUser];
  await fb.setDoc(ref, { [recipeId]: updated }, { merge: true });
}

async function setTonightRecipe(dateKey, recipeId) {
  if (!currentUser) return;
  if (currentUser !== MENU_OWNER) return; // only MENU_OWNER can set what's cooking each night
  if (!db) { alert("Not connected — the menu can't be saved right now. Check your internet connection."); return; }
  const ref = fb.doc(db, "menu", dateKey);
  if (!recipeId) {
    await fb.setDoc(ref, { recipeId: null, setBy: currentUser, setAt: new Date().toISOString() }, { merge: true });
    return;
  }
  await fb.setDoc(ref, { recipeId, setBy: currentUser, setAt: new Date().toISOString() }, { merge: true });
}

async function toggleQueue(recipeId) {
  if (!currentUser) return;
  if (!db) { alert("Not connected — the list can't be saved right now. Check your internet connection."); return; }
  const ref = fb.doc(db, "queue", "shared");
  if (queue[recipeId]) {
    // Anyone can remove any entry — it's a shared shortlist, not a personal one.
    const updated = { ...queue };
    delete updated[recipeId];
    await fb.setDoc(ref, updated);
  } else {
    await fb.setDoc(ref, {
      [recipeId]: { addedBy: currentUser, addedAt: new Date().toISOString() }
    }, { merge: true });
  }
}

// ---------- Rendering ----------
function iso8601ToMinutes(iso) {
  if (!iso) return null;
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
  if (!m) return null;
  const h = parseInt(m[1] || "0", 10);
  const min = parseInt(m[2] || "0", 10);
  return h * 60 + min;
}

function avgStars(recipeId) {
  const people = ratings[recipeId] || {};
  const vals = Object.values(people).map(p => p.stars).filter(v => typeof v === "number");
  if (!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}

function starsHtml(recipeId, interactive) {
  const mine = (ratings[recipeId]?.[currentUser]?.stars) || 0;
  let html = '<div class="stars">';
  for (let i = 1; i <= 5; i++) {
    html += `<button data-star="${i}" data-recipe="${recipeId}" class="${i <= mine ? 'filled' : ''}" ${interactive ? '' : 'disabled'}>★</button>`;
  }
  html += '</div>';
  return html;
}

const RATING_SCALE = [
  ["1", "Didn't work — not worth repeating"],
  ["2", "Edible, but something was off"],
  ["3", "Solid — fine to make again"],
  ["4", "Good — want it in regular rotation"],
  ["5", "Favorite — always excited to see it planned"],
];

function scaleLegendHtml() {
  return RATING_SCALE.map(([n, desc]) => `<div><b>${n}★</b><span>${escapeHtml(desc)}</span></div>`).join("");
}

function ratingWidgetHtml(id, recipe) {
  const people = ratings[id] || {};
  const myComment = people[currentUser]?.comment || "";
  const chips = FAMILY_MEMBERS.map(name => {
    const s = people[name]?.stars;
    return `<span class="chip">${name}: <strong>${s ? '★'.repeat(s) : '—'}</strong></span>`;
  }).join("");
  const comments = Object.entries(people)
    .filter(([, v]) => v.comment)
    .map(([name, v]) => `<div class="comment-item"><b>${name}:</b> ${escapeHtml(v.comment)}</div>`)
    .join("");
  const expanded = expandedScaleLegends.has(id);
  return `
    <div class="per-person">${chips}</div>
    <div class="stars-row">
      ${starsHtml(id, true)}
      <button class="scale-toggle" data-scale-toggle="${id}">${expanded ? "Hide" : "What do stars mean?"}</button>
    </div>
    ${expanded ? `<div class="scale-legend">${scaleLegendHtml()}</div>` : ""}
    <textarea class="comment" data-recipe="${id}" placeholder="Notes for next time (e.g. 'add more garlic')...">${escapeHtml(myComment)}</textarea>
    <div class="save-hint" data-hint="${id}"></div>
    ${comments ? `<div class="comment-list">${comments}</div>` : ""}
  `;
}

function renderTonightView() {
  const todaysMenu = menu[TODAY_KEY];
  const todaysRecipeId = todaysMenu?.recipeId || null;
  const todaysEntry = todaysRecipeId ? recipesIndex.find(r => recipeIdFromFile(r.file) === todaysRecipeId) : null;
  const todaysRecipe = todaysEntry ? recipeDetails[todaysEntry.file] : null;

  let html = "";

  // ---- Set tonight's dinner (only MENU_OWNER can change it; everyone else sees a read-only line) ----
  if (currentUser === MENU_OWNER) {
    const options = recipesIndex.map(entry => {
      const id = recipeIdFromFile(entry.file);
      const r = recipeDetails[entry.file];
      if (!r) return "";
      return `<option value="${id}" ${id === todaysRecipeId ? "selected" : ""}>${escapeHtml(r.name)}</option>`;
    }).join("");
    html += `
      <div class="set-menu">
        <div class="label">What are we having tonight?</div>
        <select id="tonightPicker">
          <option value="">— not set yet —</option>
          ${options}
        </select>
      </div>
    `;
  } else {
    html += `
      <div class="set-menu">
        <div class="label">What are we having tonight?</div>
        <div style="font-size:17px;line-height:22px;letter-spacing:-0.43px;color:var(--label)">
          ${todaysRecipe ? escapeHtml(todaysRecipe.name) : "— not set yet —"}
        </div>
      </div>
    `;
  }

  // ---- Tonight's meal, ready to rate ----
  if (todaysRecipe) {
    const id = todaysRecipeId;
    const mins = iso8601ToMinutes(todaysRecipe.totalTime);
    html += `
      <div class="card tonight-card">
        <div class="label">Tonight</div>
        <h2>${escapeHtml(todaysRecipe.name)}</h2>
        ${todaysRecipe.description ? `<p class="desc">${escapeHtml(todaysRecipe.description)}</p>` : ""}
        ${mins ? `<div class="meta-row" style="color:inherit;opacity:0.7"><span>${mins} min</span></div>` : ""}
        ${ratingWidgetHtml(id, todaysRecipe)}
      </div>
    `;
  } else {
    html += `<div class="empty">No dinner set for tonight yet. Pick one above once you know what's cooking.</div>`;
  }

  // ---- Recent nights, still open for rating ----
  // The last few nights (not counting tonight) each get their own full
  // rating widget, so the family can catch up on rating without having to
  // hunt through the Recipes tab for what was cooked when.
  const RATEABLE_PAST_NIGHTS = 2;
  const allKeys = Object.keys(menu)
    .filter(k => k <= TODAY_KEY && menu[k]?.recipeId)
    .sort((a, b) => b.localeCompare(a));
  const pastKeys = allKeys.filter(k => k !== TODAY_KEY);
  const rateableKeys = pastKeys.slice(0, RATEABLE_PAST_NIGHTS);
  const olderKeys = pastKeys.slice(RATEABLE_PAST_NIGHTS, RATEABLE_PAST_NIGHTS + 8);

  if (rateableKeys.length) {
    html += `<div class="section-label">Rate a recent night</div>`;
    html += rateableKeys.map(key => {
      const entry = menu[key];
      const recipeEntry = recipesIndex.find(r => recipeIdFromFile(r.file) === entry.recipeId);
      const recipe = recipeEntry ? recipeDetails[recipeEntry.file] : null;
      if (!recipe) return "";
      const mins = iso8601ToMinutes(recipe.totalTime);
      return `
        <div class="card">
          <div class="label" style="font-size:13px;letter-spacing:-0.08px;color:var(--label-secondary);text-transform:uppercase;margin-bottom:2px">${formatDateKey(key)}</div>
          <h3>${escapeHtml(recipe.name)}</h3>
          ${mins ? `<div class="meta-row"><span>${mins} min</span></div>` : ""}
          ${ratingWidgetHtml(entry.recipeId, recipe)}
        </div>
      `;
    }).join("");
  }

  // ---- Older history, summary only ----
  if (olderKeys.length) {
    html += `<div class="section-label">Earlier dinners</div><div class="card">`;
    html += olderKeys.map(key => {
      const entry = menu[key];
      const recipeEntry = recipesIndex.find(r => recipeIdFromFile(r.file) === entry.recipeId);
      const recipe = recipeEntry ? recipeDetails[recipeEntry.file] : null;
      const name = recipe ? recipe.name : entry.recipeId;
      const avg = recipe ? avgStars(entry.recipeId) : null;
      return `
        <div class="history-item">
          <span class="hdate">${formatDateKey(key)}</span>
          <span class="hname">${escapeHtml(name)}</span>
          <span class="hstars">${avg ? '★ ' + avg.toFixed(1) : '<span class="none">not yet rated</span>'}</span>
        </div>
      `;
    }).join("");
    html += `</div>`;
  }

  return html;
}

function renderVoteView() {
  const weekVotes = votes[CURRENT_WEEK] || {};
  // "unproven" recipes (bulk-imported from AnyList, not yet cooked/rated by
  // this app) are searchable in Choose but excluded here so the weekly vote
  // list stays focused on recipes the family actually knows.
  const votable = recipesIndex.filter(r => r.status !== "unproven");
  const sorted = [...votable].sort((a,b) => {
    const va = (weekVotes[recipeIdFromFile(a.file)] || []).length;
    const vb = (weekVotes[recipeIdFromFile(b.file)] || []).length;
    return vb - va;
  });

  let html = `<div class="banner-info">Vote for the dinners you want this week. Tap the circle to add or remove your vote — everyone's votes update live.</div>`;
  html += sorted.map(entry => {
    const id = recipeIdFromFile(entry.file);
    const recipe = recipeDetails[entry.file];
    if (!recipe) return "";
    const count = (weekVotes[id] || []).length;
    const iVoted = (weekVotes[id] || []).includes(currentUser);
    const mins = iso8601ToMinutes(recipe.totalTime);
    return `
      <div class="card vote-card">
        <div class="info">
          <h3>${recipe.name}</h3>
          <div class="meta-row">${mins ? `<span>${mins} min</span>` : ""}<span>${avgStars(id) ? '★ ' + avgStars(id).toFixed(1) : 'Not yet rated'}</span></div>
        </div>
        <div class="vote-count">
          <button class="vote-btn ${iVoted ? 'voted' : ''}" data-vote="${id}">${iVoted ? '✓' : '+'}</button>
          <span class="num">${count}</span>
        </div>
      </div>`;
  }).join("");

  if (!sorted.length) html += `<div class="empty">No recipes yet.</div>`;
  return html;
}

function recipeSearchText(entry, recipe) {
  const ingredients = (recipe.recipeIngredient || []).join(" ");
  return [recipe.name, recipe.description, ingredients, recipe.recipeCategory]
    .filter(Boolean).join(" ").toLowerCase();
}

function renderChooseView() {
  let html = `<div class="banner-info">Search every recipe in the family database and add anything you're excited to eat to the shared "Up next" list. James picks from this list (or anything else) when it's time to set a night's dinner.</div>`;
  html += `<input type="text" class="search-box" id="recipeSearch" placeholder="Search by name, ingredient, or type..." value="${escapeHtml(searchQuery)}">`;

  const q = searchQuery.trim().toLowerCase();
  const queuedIds = Object.keys(queue);

  // ---- Up next: the shared shortlist ----
  if (queuedIds.length) {
    html += `<div class="section-label">Up next</div>`;
    html += queuedIds.map(id => {
      const entry = recipesIndex.find(r => recipeIdFromFile(r.file) === id);
      const recipe = entry ? recipeDetails[entry.file] : null;
      if (!recipe) return "";
      const q = queue[id];
      const mins = iso8601ToMinutes(recipe.totalTime);
      return `
        <div class="card queue-card">
          <div class="info">
            <h3>${escapeHtml(recipe.name)}</h3>
            <div class="meta-row">${mins ? `<span>${mins} min</span>` : ""}<span>${avgStars(id) ? '★ ' + avgStars(id).toFixed(1) : 'Not yet rated'}</span></div>
            <div class="added-by">Added by ${escapeHtml(q.addedBy || "someone")}</div>
          </div>
          <button class="queue-btn queued" data-queue="${id}">Remove</button>
        </div>`;
    }).join("");
  }

  // ---- Full searchable index ----
  html += `<div class="section-label">${q ? "Search results" : "All recipes"}</div>`;
  const matches = recipesIndex.filter(entry => {
    const recipe = recipeDetails[entry.file];
    if (!recipe) return false;
    if (!q) return true;
    return recipeSearchText(entry, recipe).includes(q);
  });

  if (!matches.length) {
    html += `<div class="empty">No recipes match "${escapeHtml(searchQuery)}".</div>`;
  } else {
    html += matches.map(entry => {
      const id = recipeIdFromFile(entry.file);
      const recipe = recipeDetails[entry.file];
      const mins = iso8601ToMinutes(recipe.totalTime);
      const inQueue = !!queue[id];
      return `
        <div class="card queue-card">
          <div class="info">
            <h3>${escapeHtml(recipe.name)}</h3>
            <p class="desc">${escapeHtml(recipe.description || "")}</p>
            <div class="meta-row">${mins ? `<span>${mins} min</span>` : ""}<span>${avgStars(id) ? '★ ' + avgStars(id).toFixed(1) : 'Not yet rated'}</span></div>
          </div>
          <button class="queue-btn ${inQueue ? 'queued' : ''}" data-queue="${id}">${inQueue ? 'Added' : 'Add'}</button>
        </div>`;
    }).join("");
  }

  return html;
}

function renderRecipesView() {
  let html = "";
  // Same reasoning as Vote: keep bulk-imported "unproven" recipes out of the
  // rating list until someone actually cooks and rates one from Choose.
  const rateable = recipesIndex.filter(r => r.status !== "unproven");
  const sorted = [...rateable].sort((a,b) => {
    const ra = avgStars(recipeIdFromFile(a.file)) || 0;
    const rb = avgStars(recipeIdFromFile(b.file)) || 0;
    return rb - ra;
  });

  html += sorted.map(entry => {
    const id = recipeIdFromFile(entry.file);
    const recipe = recipeDetails[entry.file];
    if (!recipe) return "";
    const mins = iso8601ToMinutes(recipe.totalTime);

    return `
      <div class="card">
        <h3>${recipe.name}</h3>
        <p class="desc">${recipe.description || ""}</p>
        <div class="meta-row">${mins ? `<span>${mins} min</span>` : ""}${recipe.recipeYield ? `<span>${recipe.recipeYield}</span>` : ""}</div>
        ${ratingWidgetHtml(id, recipe)}
      </div>`;
  }).join("");

  if (!sorted.length) html = `<div class="empty">No recipes yet.</div>`;
  return html;
}

function renderNewView() {
  return `
    <div class="banner-info">
      This is where new recipe candidates will show up for the family to try and vote on.
      Ask Claude in your regular conversation to suggest a batch of new recipes each week —
      once added to the shared recipe list, they'll appear here automatically.
    </div>
    <div class="empty">No new candidates right now.</div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function render() {
  if (!currentUser) return;
  const main = document.getElementById("main");
  let html = "";
  if (firebaseStatus === "unavailable") {
    html += `<div class="banner-info" style="color:var(--accent-red)">Not connected to the shared database right now, so ratings and votes from others won't show up and yours won't save. Check your internet connection and reopen the app.</div>`;
  }
  if (activeView === "tonight") html += renderTonightView();
  else if (activeView === "vote") html += renderVoteView();
  else if (activeView === "choose") html += renderChooseView();
  else if (activeView === "recipes") html += renderRecipesView();
  else html += renderNewView();
  main.innerHTML = html;
  attachHandlers();
}

function attachHandlers() {
  const tonightPicker = document.getElementById("tonightPicker");
  if (tonightPicker) {
    tonightPicker.onchange = () => setTonightRecipe(TODAY_KEY, tonightPicker.value || null);
  }
  document.querySelectorAll("[data-vote]").forEach(btn => {
    btn.onclick = () => toggleVote(btn.dataset.vote);
  });
  document.querySelectorAll("[data-queue]").forEach(btn => {
    btn.onclick = () => toggleQueue(btn.dataset.queue);
  });
  const recipeSearch = document.getElementById("recipeSearch");
  if (recipeSearch) {
    // Re-render on input (to filter live), but restore focus + cursor
    // position afterward since innerHTML replacement would otherwise
    // knock focus out of the field on every keystroke.
    recipeSearch.oninput = () => {
      searchQuery = recipeSearch.value;
      const pos = recipeSearch.selectionStart;
      render();
      const restored = document.getElementById("recipeSearch");
      if (restored) {
        restored.focus();
        restored.setSelectionRange(pos, pos);
      }
    };
  }
  document.querySelectorAll(".stars button[data-star]").forEach(btn => {
    btn.onclick = () => setRating(btn.dataset.recipe, parseInt(btn.dataset.star, 10));
  });
  document.querySelectorAll("[data-scale-toggle]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.scaleToggle;
      if (expandedScaleLegends.has(id)) expandedScaleLegends.delete(id);
      else expandedScaleLegends.add(id);
      render();
    };
  });
  document.querySelectorAll("textarea.comment").forEach(ta => {
    let timer;
    ta.oninput = () => {
      clearTimeout(timer);
      const hint = document.querySelector(`[data-hint="${ta.dataset.recipe}"]`);
      if (hint) hint.textContent = "Typing…";
      timer = setTimeout(async () => {
        await setRating(ta.dataset.recipe, undefined, ta.value);
        if (hint) {
          hint.textContent = "Saved";
          setTimeout(() => { if (hint.textContent === "Saved") hint.textContent = ""; }, 1500);
        }
      }, 700);
    };
  });
}

// ---------- Name picker / onboarding ----------
function renderNamePicker() {
  const list = document.getElementById("nameList");
  list.innerHTML = FAMILY_MEMBERS.map(name =>
    `<button class="name-btn" data-name="${name}">${name}</button>`
  ).join("");
  list.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      currentUser = btn.dataset.name;
      localStorage.setItem("familyDinners.user", currentUser);
      showApp();
    };
  });
}

function showApp() {
  document.getElementById("namePicker").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("whoLabel").textContent = currentUser;
  render();
}

document.getElementById("switchUser").onclick = () => {
  currentUser = null;
  localStorage.removeItem("familyDinners.user");
  document.getElementById("app").style.display = "none";
  document.getElementById("namePicker").style.display = "flex";
};

document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.onclick = () => {
    activeView = btn.dataset.view;
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  };
});

// ---------- Boot ----------
(async function init() {
  renderNamePicker();
  await loadRecipes();
  if (currentUser && FAMILY_MEMBERS.includes(currentUser)) {
    showApp();
  }
  initFirebase(); // runs in background; app is usable before this resolves
})();

// Register service worker for installability (best-effort; ignore failures)
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
